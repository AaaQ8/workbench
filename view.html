/* ==================================================================
 * 26. 读书管理：状态（想读/在读/读完）+ 阅读进度 + 评分笔记
 * ================================================================== */
const BOOK_STATUS = { wish: '📋 想读', reading: '📖 在读', done: '✅ 读完' };
const Books = { all() { return DB.get('wb_books', []); } };

Renderers.books = () => {
  const all = Books.all();
  const reading = all.filter(b => b.status === 'reading');
  const doneN = all.filter(b => b.status === 'done').length;
  const totalPages = reading.reduce((s, b) => s + num(b.total), 0);
  const readPages = reading.reduce((s, b) => s + Math.min(num(b.page), num(b.total)), 0);
  const card = b => {
    const pct = b.total ? Math.min(100, Math.round(num(b.page) / num(b.total) * 100)) : 0;
    return `<div class="card !p-3 mb-2" data-book="${b.id}">
      <div class="flex items-start gap-2">
        <div class="flex-1 min-w-0">
          <b>${esc(b.title)}</b> <span class="small muted">${esc(b.author || '')}</span>
          <span class="tag">${BOOK_STATUS[b.status]}</span>
          ${b.rating ? `<span class="small" style="color:var(--warn)">${'⭐'.repeat(b.rating)}</span>` : ''}
        </div>
        <button class="btn btn-sm" data-b-edit>✎</button>
        <button class="btn btn-sm btn-danger" data-b-del>🗑</button>
      </div>
      ${b.status !== 'wish' && b.total ? `
        <div class="flex items-center gap-2 mt-2">
          <div class="progress flex-1"><div style="width:${pct}%"></div></div>
          <input class="input" style="width:110px" type="number" value="${num(b.page)}" data-b-page title="更新当前页">
          <span class="small muted">/${b.total}页 ${pct}%</span>
        </div>` : ''}
      ${b.note ? `<div class="small muted mt-2">📝 ${esc(b.note.slice(0, 80))}${b.note.length > 80 ? '…' : ''}</div>` : ''}
    </div>`;
  };
  return `
  <div class="grid grid-cols-3 gap-2 mb-3">
    <div class="card !p-3 text-center"><div class="stat-num" style="color:var(--pri)">${reading.length}</div><div class="small muted">正在读</div></div>
    <div class="card !p-3 text-center"><div class="stat-num" style="color:var(--ok)">${doneN}</div><div class="small muted">已读完</div></div>
    <div class="card !p-3 text-center"><div class="stat-num">${totalPages ? Math.round(readPages / totalPages * 100) : 0}%</div><div class="small muted">在读总进度</div></div>
  </div>
  <div class="card mb-3">
    <div class="card-title">➕ 添加书籍</div>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
      <input class="input" id="bk-title" placeholder="书名" style="grid-column:span 2">
      <input class="input" id="bk-author" placeholder="作者">
      <button class="btn btn-pri" id="bk-add">添加到书单</button>
    </div>
  </div>
  ${reading.length ? `<div class="card mb-3"><div class="card-title">📖 正在读（更新页码自动保存）</div>${reading.map(card).join('')}</div>` : ''}
  <div class="card">
    <div class="card-title">📚 全部书单（${all.length} 本）</div>
    ${all.length ? all.filter(b => b.status !== 'reading').map(card).join('') || '<div class="small muted">除在读外暂无其他书籍</div>' : '<div class="small muted">书单还是空的，把想读的书先收藏起来吧</div>'}
  </div>`;
};

AfterRender.books = box => {
  box.querySelector('#bk-add').onclick = () => {
    const title = $('#bk-title').value.trim();
    if (!title) { Toast.show('先填写书名', 'warn'); return; }
    const all = Books.all();
    all.unshift({ id: uid(), title, author: $('#bk-author').value.trim(), status: 'wish', page: 0, total: 0, rating: 0, note: '', addedAt: Date.now() });
    DB.set('wb_books', all);
    $('#bk-title').value = ''; $('#bk-author').value = '';
    Toast.show('已加入书单，点 ✎ 可标记在读/填写总页数'); Nav.refresh();
  };
  // 更新页码（失焦保存）
  box.addEventListener('change', e => {
    const pg = e.target.closest('[data-b-page]');
    if (!pg) return;
    const id = pg.closest('[data-book]').dataset.book;
    const all = Books.all();
    const b = all.find(x => x.id === id);
    b.page = num(pg.value);
    if (b.total && b.page >= b.total) {
      b.status = 'done';
      Toast.show('🎉 恭喜读完！去成就殿堂看看吧');
    } else Toast.show('进度已保存');
    DB.set('wb_books', all); Ach.check(); Nav.refresh();
  });
  box.addEventListener('click', async e => {
    const edit = e.target.closest('[data-b-edit]');
    const del = e.target.closest('[data-b-del]');
    if (!edit && !del) return;
    const id = (edit || del).closest('[data-book]').dataset.book;
    const all = Books.all();
    const b = all.find(x => x.id === id);
    if (del) {
      if (!await Dialog.confirm({ title: '删除书籍', danger: true, text: `从书单删除《${esc(b.title)}》？`, okText: '删除' })) return;
      DB.set('wb_books', all.filter(x => x.id !== id)); Toast.show('已删除'); Nav.refresh(); return;
    }
    Modal.open({
      title: '✎ 编辑书籍',
      body: `
        <div class="grid grid-cols-2 gap-2">
          <div><label class="fl">书名</label><input class="input" id="be-title" value="${esc(b.title)}"></div>
          <div><label class="fl">作者</label><input class="input" id="be-author" value="${esc(b.author || '')}"></div>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div><label class="fl">状态</label><select class="input" id="be-status">
            ${Object.entries(BOOK_STATUS).map(([k, v]) => `<option value="${k}" ${b.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
          <div><label class="fl">当前页</label><input class="input" type="number" id="be-page" value="${num(b.page)}"></div>
          <div><label class="fl">总页数</label><input class="input" type="number" id="be-total" value="${num(b.total)}"></div>
        </div>
        <label class="fl">评分</label>
        <div class="flex gap-1">${[1, 2, 3, 4, 5].map(n => `<span class="chip ${b.rating >= n ? 'on' : ''}" data-star="${n}" style="font-size:15px">⭐</span>`).join('')}</div>
        <label class="fl">读书笔记 / 一句话感想</label>
        <textarea class="input" id="be-note" rows="3">${esc(b.note || '')}</textarea>`,
      foot: '<button class="btn btn-pri" data-ok>保存</button>',
      onMount(m) {
        let rating = b.rating || 0;
        m.querySelectorAll('[data-star]').forEach(s => s.onclick = () => {
          rating = +s.dataset.star;
          m.querySelectorAll('[data-star]').forEach((x, i) => x.classList.toggle('on', i < rating));
        });
        m.querySelector('[data-ok]').onclick = () => {
          const title = m.querySelector('#be-title').value.trim();
          if (!title) { Toast.show('书名不能为空', 'warn'); return; }
          Object.assign(b, {
            title, author: m.querySelector('#be-author').value.trim(),
            status: m.querySelector('#be-status').value, page: num(m.querySelector('#be-page').value),
            total: num(m.querySelector('#be-total').value), rating, note: m.querySelector('#be-note').value.trim()
          });
          DB.set('wb_books', all); Modal.close(); Ach.check();
          Toast.show('书籍信息已保存'); Nav.refresh();
        };
      }
    });
  });
};

/* ==================================================================
 * LawStudy：学习队列状态（学过的 key / 收藏的 key）+ 旧数据迁移
 * 规则：每次只显示 3 条未学；点“我学完了”该卡立即换下一条（自动刷新）
 * ================================================================== */
const LawStudy = {
  learned() { return DB.get('wb_law_lkeys', []); },
  favs() { return DB.get('wb_law_fkeys', []); },
  migrate() {
    // 旧 wb_law_learned（标题）→ key（保留旧数组供每日一法使用）
    const oldL = DB.get('wb_law_learned', null);
    if (oldL && oldL.length) {
      const set = new Set(DB.get('wb_law_lkeys', []));
      oldL.forEach(t => { if (LAW_DETAIL_KEY[t]) set.add(LAW_DETAIL_KEY[t]); });
      DB.set('wb_law_lkeys', [...set]);
    }
    // 旧 wb_law_fav（标题）→ key
    const oldF = DB.get('wb_law_fav', null);
    if (oldF && oldF.length) {
      const set = new Set(DB.get('wb_law_fkeys', []));
      oldF.forEach(t => { if (LAW_DETAIL_KEY[t]) set.add(LAW_DETAIL_KEY[t]); });
      DB.set('wb_law_fkeys', [...set]);
      DB.set('wb_law_fav', []);
    }
  },
  next(n = 3) {
    const set = new Set(this.learned());
    const out = [];
    for (const e of LawLib.list) {
      if (!set.has(e.key)) { out.push(e); if (out.length === n) break; }
    }
    return out;
  },
  markLearned(key) {
    const l = this.learned();
    if (!l.includes(key)) { l.push(key); DB.set('wb_law_lkeys', l); }
  },
  toggleFav(key) {
    const f = this.favs();
    const i = f.indexOf(key);
    i === -1 ? f.push(key) : f.splice(i, 1);
    DB.set('wb_law_fkeys', f);
    return i === -1;
  },
  // 只重渲染队列区域 + 进度（保留其他模块状态）
  renderQueue() {
    const q = document.querySelector('#law-queue');
    if (!q) return;
    const queue = this.next(3);
    q.innerHTML = queue.length ? queue.map(lawEntryHTML).join('')
      : '<div class="small muted text-center py-4">🎉 1500 条法条全部学完，太厉害了！</div>';
    const n = this.learned().length;
    const bar = document.querySelector('#law-prog-bar');
    const txt = document.querySelector('#law-prog-txt');
    if (bar) bar.style.width = (n / 1500 * 100).toFixed(1) + '%';
    if (txt) txt.textContent = `已学 ${n}/1500 · 收藏 ${this.favs().length}`;
  }
};

      Toast.show(i === -1 ? '已收藏' : '已取消收藏');
    }
    Nav.refresh();
  };
  // 每日一法 · 学完：同时记录标题与 key
  box.querySelector('#lw-done').onclick = () => {
    const learned = DB.get('wb_law_learned', []);
    if (!learned.includes(today.title)) { learned.push(today.title); DB.set('wb_law_learned', learned); }
    const k = LAW_DETAIL_KEY[today.title];
    if (k) LawStudy.markLearned(k);
    Toast.show('今日法律学习完成！');
    Nav.refresh();
  };
  // 学习队列：学完一条 → 立即换下一条（自动刷新，不打断其他状态）
  box.addEventListener('click', e => {
    const learn = e.target.closest('[data-law-learn]');
    if (learn) {
      LawStudy.markLearned(learn.dataset.lawLearn);
      Toast.show('已记录，自动换上下一条 📖');
      LawStudy.renderQueue();
      return;
    }
    const fav = e.target.closest('[data-law-fav]');
    if (fav) {
      const nowFav = LawStudy.toggleFav(fav.dataset.lawFav);
      Toast.show(nowFav ? '已加入收藏 ⭐' : '已取消收藏');
      LawStudy.renderQueue();
      return;
    }
    const unfav = e.target.closest('[data-law-unfav]');
    if (unfav) {
      LawStudy.toggleFav(unfav.dataset.lawUnfav);
      Toast.show('已取消收藏');
      Nav.refresh();
    }
  });
  box.querySelector('#lw-case-add').onclick = () => {
    const text = $('#lw-case').value.trim();
    if (!text) { Toast.show('先写点内容', 'warn'); return; }
    const cases = DB.get('wb_law_cases', []);
    cases.push({ id: uid(), text, date: todayStr() });
    DB.set('wb_law_cases', cases);
    Toast.show('案例记录已保存'); Nav.refresh();
  };
};

/* 八段锦动作动画图：内联 SVG + SMIL，火柴人循环演示每式动作
 * SMIL rotate 取值格式 "角度 轴心x 轴心y"，绕肩(50,54)/髋(50,84)/颈(50,48)转
 */
function bdjAnim(i) {
  const KT5 = ' keyTimes="0;0.25;0.5;0.75;1"';
  const rot = (type, vals, dur, kt) =>
    `<animateTransform attributeName="transform" type="rotate" values="${vals}"${kt || ' keyTimes="0;0.5;1"'} dur="${dur}" repeatCount="indefinite"/>`;
  const trn = (vals, dur, kt) =>
    `<animateTransform attributeName="transform" type="translate" values="${vals}"${kt} dur="${dur}" repeatCount="indefinite"/>`;
  // 共用：腿脚（默认站姿）；手臂两条（下垂），用 pri 色突出
  const LEGS = `<g fill="none" stroke="var(--text)" stroke-width="3" stroke-linecap="round">
      <path d="M50 84 L44 93 L40 101"/><path d="M50 84 L56 93 L60 101"/>
      <path d="M36 102 L44 102"/><path d="M56 102 L64 102"/></g>`;
  const TORSO = `<path d="M50 84 L50 55"/>`;
  const HEAD = `<circle cx="50" cy="41" r="7"/>`;
  const ARMS = `<path d="M50 54 L42 78"/><path d="M50 54 L58 78"/>`;
  const body = (inner, strokeColor) =>
    `<svg viewBox="0 0 100 106" style="width:100%;max-width:118px;height:auto;display:block;margin:0 auto">
      ${LEGS}
      <g fill="none" stroke="${strokeColor || 'var(--text)'}" stroke-width="3" stroke-linecap="round">${inner}</g>
    </svg>`;
  const armG = (side, anim) => `<g stroke="var(--pri)">${side === 'l' ? '<path d="M50 54 L42 78"/>' : '<path d="M50 54 L58 78"/>'}${anim}</g>`;
  const KT3 = ' keyTimes="0;0.5;1"';

  switch (i) {
    case 0: // 托天：双臂上举，身体上拔
      return body(
        `<g>${TORSO}${HEAD}${trn('0 0;0 -2;0 0', '3.6s', KT3)}</g>` +
        armG('l', rot('rotate', '0 50 54;-165 50 54;0 50 54', '3.6s')) +
        armG('r', rot('rotate', '0 50 54;165 50 54;0 50 54', '3.6s')));
    case 1: // 射雕：左右交替拉弓
      return body(
        `<g>${TORSO}${HEAD}<g>${rot('rotate', '0 50 48;-10 50 48;0 50 48;10 50 48;0 50 48', '4s', KT5)}</g></g>` +
        armG('l', rot('rotate', '0 50 54;-78 50 54;0 50 54;78 50 54;0 50 54', '4s', KT5)) +
        armG('r', rot('rotate', '0 50 54;78 50 54;0 50 54;-78 50 54;0 50 54', '4s', KT5)));
    case 2: // 单举：左右臂交替上托下按
      return body(
        TORSO + HEAD +
        armG('l', rot('rotate', '0 50 54;-160 50 54;-160 50 54;0 50 54;0 50 54', '4s', KT5)) +
        armG('r', rot('rotate', '0 50 54;0 50 54;0 50 54;160 50 54;160 50 54', '4s', KT5)));
    case 3: // 往后瞧：头左右转
      return body(
        `<g>${TORSO}${rot('rotate', '0 50 84;-6 50 84;6 50 84;0 50 84', '3.8s', ' keyTimes="0;0.3;0.7;1"')}</g>` +
        `<g>${HEAD}${rot('rotate', '-40 50 48;40 50 48;-40 50 48', '3.8s')}</g>` +
        armG('l', rot('rotate', '0 50 54;-12 50 54;12 50 54;0 50 54', '3.8s', ' keyTimes="0;0.3;0.7;1"')) +
        armG('r', rot('rotate', '0 50 54;12 50 54;-12 50 54;0 50 54', '3.8s', ' keyTimes="0;0.3;0.7;1"')));
    case 4: // 摇头摆尾：头与髋反向摆动
      return body(
        `<g>${rot('rotate', '10 50 84;-10 50 84;10 50 84', '3.4s')}${TORSO}
           <g>${HEAD}${rot('rotate', '-15 50 48;15 50 48;-15 50 48', '3.4s')}</g></g>` +
        armG('l', rot('rotate', '0 50 54;14 50 54;0 50 54', '3.4s')) +
        armG('r', rot('rotate', '0 50 54;-14 50 54;0 50 54', '3.4s')));
    case 5: // 攀足：上身前屈摸脚
      return body(
        `<g>${rot('rotate', '0 50 84;68 50 84;0 50 84', '4.2s')}
           ${TORSO}${HEAD}
           <g stroke="var(--pri)"><path d="M50 54 L42 78"/><path d="M50 54 L58 78"/></g>
         </g>`);
    case 6: // 攒拳：左右交替冲拳
      return body(
        TORSO + HEAD +
        armG('r', rot('rotate', '0 50 54;72 50 54;72 50 54;0 50 54;0 50 54', '3.6s', KT5)) +
        armG('l', rot('rotate', '0 50 54;0 50 54;0 50 54;72 50 54;72 50 54', '3.6s', KT5)));
    case 7: // 背后七颠：提踵轻颠
      return body(
        `<g>${trn('0 0;-6 0;0 0;-6 0;0 0;-6 0;0 0', '2.2s', ' keyTimes="0;0.14;0.28;0.42;0.56;0.7;1"')}
           ${TORSO}${HEAD}
           <g stroke="var(--pri)" transform="rotate(-30 50 54)">
             <path d="M50 54 L42 78"/><path d="M50 54 L58 78"/>
           </g>
         </g>`);
  }
  return '';
}

AfterRender.wellness = box => {
  box.addEventListener('click', e => {
    const bd = e.target.closest('[data-bd]');
    if (!bd) return;
    const d = Wellness.data();
    const set = d.bdjDone[todayStr()] || [];
    const id = bd.dataset.bd;
    const i = set.indexOf(id);
    i === -1 ? set.push(id) : set.splice(i, 1);
    d.bdjDone[todayStr()] = set;
    // 完成全部 8 式 → 记录打卡 + wellness 联动
    if (set.length === 8) {
      const existDate = d.bdj.includes(todayStr());
      if (!existDate) d.bdj.push(todayStr());
      DB.set('wb_wellness', d);
      Checkin.record('wellness', { minutes: 12, note: '完成八段锦全套' });
      Toast.show('八段锦全套完成！经络舒展，已自动打卡 🧘');
    } else {
      DB.set('wb_wellness', d);
      Toast.show(`已完成 ${set.length}/8 式`, 'info');
    }
    Nav.refresh();
  });

  box.querySelector('#wl-save').onclick = () => {
    const weight = $('#wl-weight').value, sleep = $('#wl-sleep').value, mood = $('#wl-mood').value;
    if (!weight && !sleep && !mood) { Toast.show('至少填写一项再保存', 'warn'); return; }

    // 同一天覆盖
    d.body = d.body.filter(b => b.date !== todayStr());
    d.body.push({ date: todayStr(), weight: num(weight), sleep: num(sleep), mood: num(mood), note: $('#wl-note').value.trim() });
    DB.set('wb_wellness', d);
    Toast.show('身体记录已保存，健康是一切的本钱 🌿'); Nav.refresh();
  };

  box.querySelector('#wl-vadd').onclick = () => {

  const cv = box.querySelector('#wl-chart');
  if (cv) {
    const d = Wellness.data();

const Challenge = {

  current() {
    const list = this.data().list.slice().sort((a, b) => b.createdAt - a.createdAt);

  }
};

Renderers.challenge = () => {

  return `

      <div class="grid grid-cols-7 gap-1.5 text-center">

          <div class="cursor-pointer" data-chday="${date}">

    <textarea class="input mb-2" id="ch-desc" rows="2" placeholder="为什么做这个挑战？想觉察什么？"></textarea>
    <button class="btn btn-pri w-full" id="ch-add">开始 7 天挑战</button>

  <div class="card">
    <div class="card-title">🗂 历史挑战（${d.list.length} 个）</div>

        <span class="flex-1 text-sm">${esc(c.title)} <span class="small muted">${esc(c.desc.slice(0, 20))}</span></span>

AfterRender.challenge = box => {
  box.querySelector('#ch-add').onclick = () => {
    const title = $('#ch-title').value.trim();
    if (!title) { Toast.show('先填写挑战主题', 'warn'); return; }
    // 生成从今天起连续 7 天的打卡格
    const days = {};
    for (let i = 0; i < 7; i++) days[addDays(todayStr(), i)] = false;
    const d = Challenge.data();
    d.list.push({ id: uid(), title, desc: $('#ch-desc').value.trim(), days, createdAt: Date.now() });
    DB.set('wb_challenge', d);
    Toast.show('挑战开始，每一天都是一次觉察 🔍'); Nav.refresh();
  };
  box.addEventListener('click', async e => {
    const day = e.target.closest('[data-chday]');
    if (day) {
      const d = Challenge.data();
      const cur = d.list.slice().sort((a, b) => b.createdAt - a.createdAt)[0];
      const date = day.dataset.chday;
      // 不允许打未来的卡
      if (date > todayStr()) { Toast.show('未来的日子还没到，到时再打', 'warn'); return; }
      cur.days[date] = !cur.days[date];
      DB.set('wb_challenge', d);
      Toast.show(cur.days[date] ? '完成今日觉察 ✓' : '已取消');
      Nav.refresh(); return;
    }
    const del = e.target.closest('[data-ch-del]');
    if (del) {
      if (!await Dialog.confirm({ title: '删除挑战', danger: true, text: '删除这个挑战及其打卡记录？', okText: '删除' })) return;
      const d = Challenge.data();
      d.list = d.list.filter(c => c.id !== del.dataset.chDel);
      DB.set('wb_challenge', d); Toast.show('已删除'); Nav.refresh();

  });
};

    box.querySelector('#sp-hist').innerHTML = hist.length ? hist.map(h => `
      <div class="flex items-center gap-2 py-2 border-b flex-wrap" style="border-color:var(--border)">
        <span class="small muted" style="width:74px">${h.date.slice(5)}</span>
        <span class="small flex-1 truncate">${esc(h.type)} · ${esc(h.loc)}</span>
        <b class="small" style="color:${h.profit > 0 ? 'var(--ok)' : 'var(--err)'}">${h.profit > 0 ? '月赚' : '月亏'} ${Math.abs(h.profit)}</b>
        <button class="btn btn-sm btn-danger" data-sp-del="${h.id}">🗑</button>
      </div>`).join('') : '<div class="small muted">还没有评估记录</div>';
  };
  box.querySelector('#sp-calc').onclick = () => {
    const type = box.querySelector('#sp-type').value.trim() || '未填类型';
    const loc = box.querySelector('#sp-loc').value.trim() || '未填地段';
    const rent = num(box.querySelector('#sp-rent').value), salary = num(box.querySelector('#sp-salary').value);
    const util = num(box.querySelector('#sp-util').value), invest = num(box.querySelector('#sp-invest').value);
    const price = num(box.querySelector('#sp-price').value), traffic = num(box.querySelector('#sp-traffic').value);
    const margin = num(box.querySelector('#sp-margin').value), days = num(box.querySelector('#sp-days').value) || 30;
    if (!price || !traffic) { Toast.show('请填写客单价和日均客流', 'warn'); return; }
    // ---- 核心计算 ----
    const revenue = Math.round(price * traffic * days);              // 月营业额
    const gross = Math.round(revenue * margin / 100);               // 月毛利
    const fixed = rent + salary + util;                             // 月固定成本
    const profit = gross - fixed;                                   // 月净利润
    const payback = profit > 0 ? Math.ceil(invest / profit) : null; // 回本周期（月）
    const yearProfit = profit * 12;
    // 结论分级
    const verdict = profit < 0 ? { t: '❌ 不赚钱，建议别开或重新谈成本', c: 'var(--err)' }
      : payback && payback > 36 ? { t: '🟡 回本太慢（超3年），谨慎', c: 'var(--warn)' }
      : payback && payback > 18 ? { t: '🟠 回本偏慢（1.5-3年），可做但有更好的选择', c: 'var(--warn)' }
      : { t: '✅ 账面上是门不错的生意', c: 'var(--ok)' };
    const rec = { id: uid(), date: todayStr(), type, loc, revenue, profit, payback };
    const hist = DB.get('wb_shop', []);
    hist.unshift(rec); DB.set('wb_shop', hist.slice(0, 100));
    renderHist();
    box.querySelector('#sp-result').innerHTML = `
      <div class="card !p-3" style="border-color:${verdict.c}">
        <b style="color:${verdict.c}">${verdict.t}</b>
        <hr class="hr">
        <div class="grid grid-cols-2 gap-1">
          <div class="small">月营业额</div><div class="small text-right"><b>¥${revenue}</b></div>
          <div class="small muted">月毛利（${margin}%）</div><div class="small muted text-right">¥${gross}</div>
          <div class="small muted">月固定成本（租+人+杂）</div><div class="small muted text-right">¥${fixed}</div>
          <div class="small"><b>月净利润</b></div>
          <div class="text-right"><b style="color:${profit > 0 ? 'var(--ok)' : 'var(--err)'}">¥${profit}</b></div>
          <div class="small muted">年净利润（按此估算）</div><div class="small muted text-right">¥${yearProfit}</div>
          <div class="small muted">回本周期</div>
          <div class="small muted text-right">${payback ? payback + ' 个月（约' + (payback / 12).toFixed(1) + '年）' : '无法回本'}</div>
        </div>
        <div class="small muted mt-2">⚠️ 以上为静态估算：客流是最关键变量，建议按“保守客流”再算一遍；预留 3-6 个月现金流。</div>
      </div>`;
    Toast.show('评估完成，已存入历史');
  };
  box.addEventListener('click', async e => {
    const d = e.target.closest('[data-sp-del]');
    if (!d) return;
    if (!await Dialog.confirm({ title: '删除记录', danger: true, text: '删除这条评估记录？', okText: '删除' })) return;
    DB.set('wb_shop', DB.get('wb_shop', []).filter(x => x.id !== d.dataset.spDel));
    Toast.show('已删除'); renderHist();
  });
};

const CalUI = { y: new Date().getFullYear(), m: new Date().getMonth() }; // 显示的年月
const CalData = {
  all() { return DB.get('wb_calendar', {}); },
  day(date) { return this.all()[date] || []; },
  setDay(date, photos) {
    const all = this.all();
    if (photos.length) all[date] = photos; else delete all[date];
    DB.set('wb_calendar', all);
  }
};
// 图片压缩（canvas 缩放 + JPEG），避免 localStorage 被原图撑爆
function compressImage(file, maxSize = 1280, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxSize / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = fr.result;
    };
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

Renderers.calendar = () => {
  const { y, m } = CalUI;
  const first = new Date(y, m, 1).getDay();        // 1号星期几（0=周日）
  const days = new Date(y, m + 1, 0).getDate();    // 当月天数
  const data = CalData.all();
  const t = todayStr();
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div class="cal-blank"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const photos = data[ds] || [];
    const first2 = photos[0];
    cells += `<div class="cal-cell ${ds === t ? 'today' : ''}" data-calday="${ds}">
      <span class="num">${d}</span>
      ${first2 ? `<img class="thumb" src="${first2.src}" alt="" loading="lazy"><span class="cam">📷${photos.length > 1 ? photos.length : ''}</span>` : ''}
    </div>`;
  }
  return `
  <div class="card mb-3">
    <div class="card-title">🗓️ 照片日历
      <span class="small muted font-normal">点日期添加风景/美食照片，有照片自动标记</span></div>
    <div class="flex items-center gap-2 mb-3">
      <button class="btn btn-sm" id="cal-prev">←</button>
      <b class="flex-1 text-center">${y} 年 ${m + 1} 月</b>
      <button class="btn btn-sm" id="cal-today">今天</button>
      <button class="btn btn-sm" id="cal-next">→</button>
    </div>
    <div class="grid grid-cols-7 gap-1 mb-1 text-center small muted">
      ${['日','一','二','三','四','五','六'].map(w => `<div>${w}</div>`).join('')}

    <div class="grid grid-cols-7 gap-1">${cells}</div>
  </div>`;
};

  };

// 某天详情弹层
CalUI.openDay = function (date) {
  const renderPhotos = (m, photos) => {
    m.querySelector('#cal-photos').innerHTML = photos.length ? photos.map(p => `
      <div style="position:relative">
        <img src="${p.src}" style="width:100%;border-radius:10px;display:block" alt="">
        <input class="input mt-1" value="${esc(p.caption || '')}" data-caption="${p.id}" placeholder="配句话：在哪吃的/什么风景">
        <button class="btn btn-sm btn-danger" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.4);color:#fff;border:none"
          data-phdel="${p.id}">🗑</button>
      </div>`).join('')
      : '<div class="small muted text-center py-3">这一天还没有照片，风景、美食、随手拍都可以放</div>';
  };
  Modal.open({
    title: '📷 ' + fmtFull(date),
    body: `
      <div class="grid grid-cols-2 gap-2" id="cal-photos"></div>
      <label class="btn w-full mt-3 cursor-pointer">➕ 添加照片（可多选，自动压缩）
        <input type="file" id="cal-file" accept="image/*" multiple class="hidden"></label>
      <div class="small muted text-center mt-2">手机上点按钮可直接拍照</div>`,
    onMount(m) {
      let photos = CalData.day(date);
      renderPhotos(m, photos);
      m.querySelector('#cal-file').onchange = async ev => {
        const files = [...ev.target.files];
        Toast.show(`正在处理 ${files.length} 张照片…`, 'info');
        for (const f of files) {
          try { photos.push({ id: uid(), src: await compressImage(f), caption: '', at: Date.now() }); }
          catch (e) { Toast.show('有一张图片读取失败', 'error'); }
        }
        CalData.setDay(date, photos);
        renderPhotos(m, photos);
        Toast.show('照片已保存，日历上有📷标记啦');
        Nav.refresh();
      };
      // 删除照片
      m.addEventListener('click', async e => {
        const b = e.target.closest('[data-phdel]');
        if (!b) return;
        if (!await Dialog.confirm({ title: '删除照片', danger: true, text: '从这一天删除这张照片？', okText: '删除' })) return;
        photos = photos.filter(p => p.id !== b.dataset.phdel);
        CalData.setDay(date, photos);
        renderPhotos(m, photos);
        Toast.show('已删除'); Nav.refresh();
      });
      // 修改配文（失焦保存）
      m.addEventListener('change', e => {
        const c = e.target.closest('[data-caption]');
        if (!c) return;
        const p = photos.find(x => x.id === c.dataset.caption);
        if (p) { p.caption = c.value; CalData.setDay(date, photos); Toast.show('配文已保存'); }
      });
    }
  });
};

AfterRender.office = box => {
  const TOTAL = OFFICE_DATA.reduce((s, t) => s + t.items.length, 0);
  // 顶部计数 + 进度条随标记实时更新
  const updateHead = () => {
    const n = DB.get('wb_office_done', []).length;
    const tag = box.querySelector('.card-title .tag');
    if (tag) tag.textContent = `${n}/${TOTAL} 已掌握`;
    const bar = box.querySelector('.card .progress > div');
    if (bar) bar.style.width = Math.round(n / TOTAL * 100) + '%';
  };
  const renderList = () => {
    const tab = OFFICE_DATA.find(t => t.id === OfficeUI.tab);
    const done = DB.get('wb_office_done', []);
    const q = OfficeUI.q.toLowerCase();
    const items = tab.items.map((it, i) => ({ ...it, uid: tab.id + '_' + i }))
      .filter(it => (!OfficeUI.onlyLeft || !done.includes(it.uid))
        && (!q || (it.keys + it.desc).toLowerCase().includes(q)));
    box.querySelector('#of-list').innerHTML = items.length ? items.map(it => {
      const ok = done.includes(it.uid);
      return `<div class="card !p-3 mb-2 flex items-center gap-3">
        <span class="chip on" style="min-width:150px;justify-content:center">${esc(it.keys)}</span>
        <span class="flex-1 small ${ok ? 'muted' : ''}">${ok ? '✅ ' : ''}${esc(it.desc)}</span>
        <button class="btn btn-sm" data-ofdone="${it.uid}">${ok ? '取消' : '已掌握'}</button>
      </div>`;
    }).join('') : '<div class="empty">没有符合条件的项目</div>';
  };
  renderList();
  box.querySelectorAll('[data-oftab]').forEach(el => el.onclick = () => { OfficeUI.tab = el.dataset.oftab; Nav.refresh(); });
  box.querySelector('#of-search').oninput = debounce(e => { OfficeUI.q = e.target.value; renderList(); }, 150);
  box.querySelector('#of-filter').onclick = () => { OfficeUI.onlyLeft = !OfficeUI.onlyLeft; Nav.refresh(); };
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-ofdone]');
    if (!b) return;
    const set = DB.get('wb_office_done', []);
    const i = set.indexOf(b.dataset.ofdone);
    i === -1 ? set.push(b.dataset.ofdone) : set.splice(i, 1);
    DB.set('wb_office_done', set);
    Toast.show(i === -1 ? '标记为已掌握，多用几次巩固' : '已取消');
    renderList(); updateHead();
  });
};

  _breakGoal(el) {
    const text = el.querySelector('#ai-goal').value.trim();
    if (!text) { Toast.show('先输入年度目标', 'warn'); return; }
    // 简单分句：识别目标中的多个目标（顿号/逗号/分号分隔）
    const goals = text.split(/[、;；\n]|，(?=.*?(?:通过|学|练|读|考))/).map(s => s.trim()).filter(Boolean);
    const templates = {
      cet: { key: /四级|英语|cet/i, weekly: ['背四级单词 50 个', '精听听力 30 分钟', '做 1 套阅读真题'], today: '背四级单词 30 个 + 复习旧词' },
      dance: { key: /舞|爵士/, weekly: ['基本功 Isolation 3 次', '成品舞跟练 2 次', '完整顺一遍舞蹈'], today: '舞蹈基本功 20 分钟' },
      vocal: { key: /唱|练声|歌/, weekly: ['开嗓练习 4 次', '录一遍自己唱的歌回听', '练 1 首待练歌曲'], today: '气息+开嗓 15 分钟' },
      book: { key: /书|阅读/, weekly: ['阅读 5 天，每次 30 分钟', '写 1 段读书笔记', '整理书单'], today: '阅读 20 分钟' }
    };
    let blocks = '';
    const weeklyTasks = [], todayTasks = [];
    goals.forEach((g, i) => {
      const t = Object.values(templates).find(x => x.key.test(g));
      const w = t ? t.weekly : [`围绕「${g}」推进关键动作`, '周末检查本周进度', '准备下周所需资源'];
      const td = t ? t.today : `为「${g}」迈出第一步（15分钟）`;
      weeklyTasks.push(...w.map(x => `[${g}] ${x}`));
      todayTasks.push(`[${g}] ${td}`);

        <div class="card !p-3 mb-2">
          <b>🎯 目标 ${i + 1}：${esc(g)}</b>
          <div class="small muted mt-1">季度节奏：基础期（1-3月打底）→ 强化期（4-9月大量练习）→ 冲刺期（10-12月查漏补缺）</div>

  reviewDiary() { AI.open('diary'); setTimeout(() => AI._reviewDiary($('#ai-body')), 50); },
  _reviewDiary(el) {

    if (!diaries.length) {

    const emoWords = { '焦虑/紧张': /焦虑|紧张|慌|压力/, '低落': /难过|低落|委屈|丧|哭/, '开心/平静': /开心|平静|放松|高兴|满足/, '愤怒': /生气|愤怒|烦|讨厌/ };
    const patWords = { '灾难化思维': /灾难|完了|肯定不行/, '非黑即白': /要么|必须|一定/, '成长型思维': /学到|进步|下次|可以改/, '自我否定': /我不行|我太差|自责/ };
    const hit = dict => Object.entries(dict).filter(([, re]) => re.test(text)).map(([k]) => k);

        <div class="text-sm mt-1"><b>🧩 常见思考模式：</b>${pats.length ? pats.join('、') : '未识别出明显模式'}</div>
        <div class="text-sm mt-1"><b>✅ 行动改变：</b>${hasAction}/${diaries.length} 篇写下了「下次怎么做」</div>
      </div>
      <div class="card !p-3 mb-2" style="background:var(--bg)">
        <b class="small">💡 AI 的观察与建议</b>

          ${pats.includes('自我否定') ? '· 注意到自我否定的声音。像对待好朋友一样对自己说话——你会这样说她吗？<br>' : ''}
          ${pats.includes('成长型思维') ? '· 很棒！你已经多次从事件中提炼「下次怎么做」，这就是成长型思维的样子。<br>' : ''}
          · 坚持每天四问，${hasAction < diaries.length ? '记得把第 4 问「下次怎么做」补上，' : ''}每周复盘一次，一个月后你会明显更了解自己。
        </div>

      <button class="btn btn-pri btn-sm" onclick="Modal.close();Nav.go('notes','meta')">去写今天的日记 →</button>`;

  /* ---------- ③ 按可用时间生成每日计划（任务块动态分配） ---------- */
  _genDay(el, minutes) {
    if (!minutes || minutes < 10) { Toast.show('时间太短啦，至少 10 分钟', 'warn'); return; }
    // 任务池：按优先级排，每项 [名称, 分钟, 类型]
    const pool = [
      ['背四级单词（新词+复习）', 25, 'cet'],
      ['精听听力 / 跟读', 25, 'cet'],
      ['爵士舞基本功 / 跟练', 30, 'dance'],

/* ==================================================================
 * 白噪音：9 种环境声（Web Audio 合成，循环播放，无需音频文件）
 * 雨/森林/海浪/篝火/风/咖啡馆/键盘/夜虫鸣/溪流 —— 与专注训练同模块
 * ================================================================== */
const WhiteNoise = {
  ctx: null, nodes: null, type: null, vol: 0.5,
  // 声音配置：noise 类型 / 滤波器 / 频率 / LFO 振幅调制（模拟起伏变化）
  cfg: {
    rain:     { label: '🌧️ 雨声',   noise: 'white', filter: 'lowpass',  freq: 2200, lfo: null },
    forest:   { label: '🌳 森林',   noise: 'pink',  filter: 'lowpass',  freq: 800,  lfo: null },
    wave:     { label: '🌊 海浪',   noise: 'brown', filter: 'lowpass',  freq: 900,  lfo: { rate: 0.12, depth: 0.5 } },
    campfire: { label: '🔥 篝火',   noise: 'pink',  filter: 'lowpass',  freq: 700,  lfo: { rate: 0.4, depth: 0.2 } },
    wind:     { label: '🍃 风声',   noise: 'brown', filter: 'bandpass', freq: 500,  lfo: { rate: 0.07, depth: 0.6 } },
    cafe:     { label: '☕ 咖啡馆', noise: 'brown', filter: 'lowpass',  freq: 2000, lfo: null },
    keyboard: { label: '⌨️ 键盘',   noise: 'white', filter: 'bandpass', freq: 1800, lfo: { rate: 0.6, depth: 0.3 } },
    night:    { label: '🌙 夜虫鸣', noise: 'pink',  filter: 'highpass', freq: 3000, lfo: { rate: 0.5, depth: 0.4 } },
    stream:   { label: '💧 溪流',   noise: 'white', filter: 'bandpass', freq: 1200, lfo: { rate: 0.2, depth: 0.35 } }
  },
  // 生成噪声缓冲（white 白噪 / pink 粉噪 / brown 棕噪）
  makeBuffer(ctx, kind) {
    const bufSize = 2 * ctx.sampleRate;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const out = buf.getChannelData(0);
    if (kind === 'white') {
      for (let i = 0; i < bufSize; i++) out[i] = Math.random() * 2 - 1;
    } else if (kind === 'pink') {
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < bufSize; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99765 * b0 + w * 0.099; b1 = 0.96300 * b1 + w * 0.297; b2 = 0.57000 * b2 + w * 1.0;
        out[i] = (b0 + b1 + b2 + w * 0.18) * 0.18;
      }
    } else { // brown 棕噪（更低沉）
      let last = 0;
      for (let i = 0; i < bufSize; i++) {
        const w = Math.random() * 2 - 1;
        last = (last + 0.02 * w) / 1.02;
        out[i] = last * 3.5;
      }
    }
    return buf;
  },
  start(type) {
    this.stop();
    const c = this.cfg[type];
    if (!c) return;
    this.type = type;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { Toast.show('当前浏览器不支持白噪音', 'err'); return; }
    if (!this.ctx) this.ctx = new Ctx();
    const ctx = this.ctx;
    if (ctx.state === 'suspended') ctx.resume();
    const src = ctx.createBufferSource();
    src.buffer = this.makeBuffer(ctx, c.noise); src.loop = true;
    const gain = ctx.createGain(); gain.gain.value = this.vol;
    const filter = ctx.createBiquadFilter();
    filter.type = c.filter; filter.frequency.value = c.freq;
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    src.start();
    const nodes = { src, gain, filter, lfo: null };
    // LFO 振幅调制：让声音有起伏（海浪的涨退、风声的强弱）
    if (c.lfo) {
      const lfo = ctx.createOscillator();
      lfo.frequency.value = c.lfo.rate;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = c.lfo.depth;
      lfo.connect(lfoGain); lfoGain.connect(gain.gain); // 调制 gain 的增益
      lfo.start();
      nodes.lfo = lfo;
    }
    this.nodes = nodes;
  },
  setVol(v) { this.vol = v; if (this.nodes) this.nodes.gain.gain.value = v; },
  stop() {
    if (this.nodes) {
      try { this.nodes.src.stop(); } catch (e) {}
      try { this.nodes.lfo && this.nodes.lfo.stop(); } catch (e) {}
      this.nodes = null;
    }
    this.type = null;
  }
};

/* ==================================================================
 * 专注训练：番茄工作法（25 分专注 + 5 分休息）+ 白噪音 9 声合一
 * ================================================================== */
const Focus = {
  dir: DB.get('wb_focus_dir', 'down'),   // down 倒计时 / up 正计时
  mode: 'work', workMin: 25, breakMin: 5,
  remain: 25 * 60, elapsed: 0,
  running: false, timer: null,
  note: '',
  cycles: DB.get('wb_focus_cycles_' + todayStr(), 0),
  totalMin: DB.get('wb_focus_total_min', 0),
  totalCount: DB.get('wb_focus_total_count', 0),
  logs: DB.get('wb_focus_logs', []),
  toggle() { this.running ? this.pause() : this.start(); },
  start() {
    this.running = true;
    this.timer = setInterval(() => {
      if (this.dir === 'up') {
        this.elapsed++;
        Nav.refresh();
      } else {
        this.remain--;
        if (this.remain <= 0) { this.complete(); return; }
        Nav.refresh();
      }
    }, 1000);
  },
  pause() { this.running = false; clearInterval(this.timer); },
  reset() {
    this.pause();
    if (this.dir === 'up') this.elapsed = 0;
    else this.remain = (this.mode === 'work' ? this.workMin : this.breakMin) * 60;
  },
  setMode(m) { this.pause(); this.mode = m; this.remain = (m === 'work' ? this.workMin : this.breakMin) * 60; },
  setWorkMin(min) { this.pause(); this.workMin = min; this.mode = 'work'; this.remain = min * 60; },
  // 切换计时方向：暂停并重置各自计时值
  setDir(d) {
    this.pause();
    this.dir = d;
    DB.set('wb_focus_dir', d);
    if (d === 'up') { this.elapsed = 0; }
    else { this.mode = 'work'; this.remain = this.workMin * 60; }
  },
  // 记录一段专注（倒计时自动完成 / 正计时手动结束 共用）
  recordSession(min, dir) {
    this.cycles++;
    DB.set('wb_focus_cycles_' + todayStr(), this.cycles);
    this.totalMin += min;
    this.totalCount++;
    DB.set('wb_focus_total_min', this.totalMin);
    DB.set('wb_focus_total_count', this.totalCount);
    this.logs.unshift({ id: uid(), date: todayStr(), min, note: this.note, dir, at: Date.now() });
    if (this.logs.length > 300) this.logs.length = 300;
    DB.set('wb_focus_logs', this.logs);
    Checkin.record('wellness', { minutes: min, note: (this.note || '专注') + (dir === 'up' ? '（正计时）' : '') });
  },
  // 正计时：手动结束并按实际时长记录（不足 1 分钟按 1 分钟）
  finishUp() {
    this.pause();
    const min = Math.max(1, Math.round(this.elapsed / 60));
    this.recordSession(min, 'up');
    const what = this.note ? `（${this.note}）` : '';
    Toast.show(`🎯 本次专注 ${min} 分钟${what}，今日已 ${this.cycles} 次`);
    this.elapsed = 0; this.note = '';
    Nav.refresh();
  },
  // 倒计时：到时自动完成
  complete() {
    this.pause();
    if (this.mode === 'work') {
      this.recordSession(this.workMin, 'down');
      const what = this.note ? `（${this.note}）` : '';
      Toast.show(`🎯 番茄完成${what}！休息 ${this.breakMin} 分钟，今日已 ${this.cycles} 个`);
      this.note = '';
      this.mode = 'break'; this.remain = this.breakMin * 60;
    } else {
      Toast.show('☕ 休息结束，继续专注吧');
      this.mode = 'work'; this.remain = this.workMin * 60;
    }
    Nav.refresh();
  }
};
Renderers.focus = () => {
  const t = WhiteNoise.type;
  // 秒 → H:MM:SS / MM:SS
  const fmtClock = s => {
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    const p = n => String(n).padStart(2, '0');
    return h > 0 ? `${h}:${p(m)}:${p(ss)}` : `${p(m)}:${p(ss)}`;
  };
  const isUp = Focus.dir === 'up';
  const showSec = isUp ? Focus.elapsed : Focus.remain;
  const total = (Focus.mode === 'work' ? Focus.workMin : Focus.breakMin) * 60;
  const pct = !isUp ? Math.round((1 - Focus.remain / total) * 100) : 0;
  // 统计：累计时长格式化为 Xh Ym
  const fmtHm = m => m >= 60 ? `${Math.floor(m/60)} 小时 ${m%60} 分` : `${m} 分钟`;
  // 14 天历史
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const dStr = addDays(todayStr(), -i);
    const c = DB.get('wb_focus_cycles_' + dStr, 0);
    days.push({ d: dStr.slice(5), c });

const Meditate = {
  breaths: {
    '478':  { name: '4-7-8 助眠呼吸', steps: [{ p: 'in', s: 4, t: '吸气 4 秒' }, { p: 'hold', s: 7, t: '屏息 7 秒' }, { p: 'out', s: 8, t: '呼气 8 秒' }] },
    'box':  { name: '方块呼吸（专注）', steps: [{ p: 'in', s: 4, t: '吸气 4 秒' }, { p: 'hold', s: 4, t: '屏息 4 秒' }, { p: 'out', s: 4, t: '呼气 4 秒' }, { p: 'hold', s: 4, t: '屏息 4 秒' }] },
    'relax':{ name: '放松呼吸', steps: [{ p: 'in', s: 4, t: '吸气 4 秒' }, { p: 'out', s: 6, t: '呼气 6 秒' }] }
  },
  breathKey: null, step: 0, timer: null, running: false,
  sessionMin: 10, remain: 0, sessionTimer: null, sessionRunning: false,
  data() { return DB.get('wb_meditate', { logs: [] }); },
  cycles: DB.get('wb_meditate_cycles_' + todayStr(), 0),
  // 呼吸引导：循环播放各步骤
  startBreath(key) {
    this.stopBreath();
    this.breathKey = key; this.step = 0; this.running = true;
    this.tickBreath();
  },
  tickBreath() {
    if (!this.running) return;
    const b = this.breaths[this.breathKey];
    if (!b) return;
    const cur = b.steps[this.step];
    const circle = document.getElementById('md-circle');
    const text = document.getElementById('md-text');
    if (circle) {
      circle.style.transition = `transform ${cur.s}s ease-in-out`;
      circle.style.transform = cur.p === 'in' ? 'scale(1.6)' : cur.p === 'out' ? 'scale(0.7)' : 'scale(' + (this.step > 0 && b.steps[this.step - 1].p === 'in' ? 1.6 : 0.7) + ')';
    }
    if (text) text.textContent = cur.t;
    this.timer = setTimeout(() => {
      this.step = (this.step + 1) % b.steps.length;
      this.tickBreath();
    }, cur.s * 1000);
  },
  stopBreath() { this.running = false; clearTimeout(this.timer); this.breathKey = null; },
  // 冥想计时
  startSession() {
    if (this.sessionRunning) return;
    this.remain = this.sessionMin * 60; this.sessionRunning = true;
    this.sessionTimer = setInterval(() => {
      this.remain--;
      if (this.remain <= 0) { this.completeSession(); return; }
      Nav.refresh();
    }, 1000);
  },
  pauseSession() { this.sessionRunning = false; clearInterval(this.sessionTimer); },
  resetSession() { this.pauseSession(); this.remain = 0; },
  completeSession() {
    this.pauseSession();
    const d = this.data();
    d.logs.unshift({ id: uid(), date: todayStr(), minutes: this.sessionMin, at: Date.now() });
    DB.set('wb_meditate', d);
    this.cycles++;
    DB.set('wb_meditate_cycles_' + todayStr(), this.cycles);
    Checkin.record('wellness', { minutes: this.sessionMin, note: '冥想 ' + this.sessionMin + ' 分钟' });
    Toast.show(`🧘 冥想完成！今日已冥想 ${this.cycles} 次，身心都放松了`);
    this.remain = 0;
    Nav.refresh();
  }
};

/* ==================================================================
 * 课程表：20 周学期，左右滑动切换周次，每节直接填课程
 * ================================================================== */
const Schedule = {
  data() { return DB.get('wb_schedule', { currentWeek: 1, slots: 6, times: ['08:00','09:00','10:00','14:00','15:00','16:00'], cells: {}, courses: [] }); },
  key(w, d, s) { return `w${w}_d${d}_s${s}`; },
  // 原站口径：周一=1…周六=6，周日=0 → 当前网格 di（周一=0…周日=6）
  dayToDi(day) { return day === 0 ? 6 : day - 1; },
  cellVal(name, room) { return name + (room ? '@' + room : ''); },
  // 添加课程：登记到 courses，并把课写入 20 周对应格子
  addCourse(c) {
    const d = this.data();
    d.courses = d.courses || [];
    const co = { id: uid(), name: c.name, room: c.room, teacher: c.teacher, day: c.day, period: c.period };
    d.courses.push(co);
    const di = this.dayToDi(c.day), val = this.cellVal(c.name, c.room);
    for (let wk = 1; wk <= 20; wk++) d.cells[this.key(wk, di, c.period)] = val;
    DB.set('wb_schedule', d);
    return co;
  },
  // 删除课程：移除登记，并清掉 20 周中内容完全一致的格子（手动改过的不动）
  removeCourse(id) {
    const d = this.data();
    const co = (d.courses || []).find(x => x.id === id);
    if (!co) return;
    d.courses = d.courses.filter(x => x.id !== id);
    const di = this.dayToDi(co.day), val = this.cellVal(co.name, co.room);
    for (let wk = 1; wk <= 20; wk++) {
      const k = this.key(wk, di, co.period);
      if (d.cells[k] === val) delete d.cells[k];
    }
    DB.set('wb_schedule', d);
  }
};

// —— 乐理与声音：标准调弦空弦频率（低 E → 高 E）——
const GT_STRINGS = [
  { n: 'E2', f: 82.41 }, { n: 'A2', f: 110.00 }, { n: 'D3', f: 146.83 },
  { n: 'G3', f: 196.00 }, { n: 'B3', f: 246.94 }, { n: 'E4', f: 329.63 }
];
const GuitarTone = {
  ctx: null,
  ac() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; },
  // 拨弦音色：三角波 + 快速衰减包络
  pluck(freq, when, dur) {
    const ctx = this.ac();
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'triangle'; osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.35, when + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    osc.connect(g).connect(ctx.destination);
    osc.start(when); osc.stop(when + dur + 0.05);
  },
  // 扫弦：低到高依次拨响，每根错 30ms
  strum(code) {
    const ctx = this.ac(), t0 = ctx.currentTime;
    let hit = 0;
    code.forEach((fr, i) => {
      if (fr === 'x') return;
      const f = GT_STRINGS[i].f * Math.pow(2, fr / 12);
      this.pluck(f, t0 + hit * 0.03, 2.4);
      hit++;
    });
  },
  // 单音持续发声（调音用）
  tone(freq) {
    const ctx = this.ac(), t = ctx.currentTime;
    this.pluck(freq, t, 2.0);
  }
};

// —— 常用开放和弦按法（低 E→高 E；'x' 不弹，数字为品格，0 为空弦）——
const GT_CHORDS = [
  { n: 'C',     c: ['x',3,2,0,1,0] },
  { n: 'G',     c: [3,2,0,0,0,3] },
  { n: 'D',     c: ['x','x',0,2,3,2] },
  { n: 'A',     c: ['x',0,2,2,2,0] },
  { n: 'E',     c: [0,2,2,1,0,0] },
  { n: 'F',     c: [1,3,3,2,1,1] },
  { n: 'Am',    c: ['x',0,2,2,1,0] },
  { n: 'Em',    c: [0,2,2,0,0,0] },
  { n: 'Dm',    c: ['x','x',0,2,3,1] },
  { n: 'D7',    c: ['x','x',0,2,1,2] },
  { n: 'A7',    c: ['x',0,2,0,2,0] },
  { n: 'E7',    c: [0,2,0,1,0,0] },
  { n: 'G7',    c: [3,2,0,0,0,1] },
  { n: 'C7',    c: ['x',3,2,3,1,0] },
  { n: 'Fmaj7', c: ['x','x',3,2,1,0] },
  { n: 'Cadd9', c: ['x',3,2,0,3,0] },
  { n: 'Asus2', c: ['x',0,2,2,0,0] },

// 文件大小格式化（渲染与视频库共用）
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

// 小和弦图：6 弦 × 5 品，绝对定位画点 / 横杠
function gtChordDiagram(c) {
  const W = 72, H = 86, colX = i => 7 + i * 11.6, frY = f => f * 14;
  const nums = c.filter(v => v !== 'x');
  const isBarre = nums.length >= 5 && nums.every(v => v === nums[0]);
  let dots = '';
  c.forEach((v, i) => {
    if (v === 'x') dots += `<span style="position:absolute;left:${colX(i)-4}px;top:-13px;font-size:11px;color:var(--muted)">×</span>`;
    else if (v === 0) dots += `<span style="position:absolute;left:${colX(i)-3}px;top:-14px;font-size:11px;color:var(--muted)">○</span>`;
    else dots += `<span style="position:absolute;left:${colX(i)-4}px;top:${frY(v)-4}px;width:8px;height:8px;border-radius:50%;background:var(--text)"></span>`;
  });
  if (isBarre) {
    const f = nums[0];
    dots += `<span style="position:absolute;left:3px;top:${frY(f)-3}px;width:${W-6}px;height:6px;border-radius:3px;background:var(--text)"></span>`;
  }
  return `<div style="position:relative;width:${W}px;height:${H}px;margin:4px auto 0">
      <div style="position:absolute;left:0;right:0;top:0;height:3px;background:var(--text);border-radius:2px"></div>
      ${[1,2,3,4,5].map(f => `<div style="position:absolute;left:0;right:0;top:${frY(f)}px;height:1px;background:var(--border)"></div>`).join('')}
      ${[0,1,2,3,4,5].map(i => `<div style="position:absolute;left:${colX(i)}px;top:0;bottom:0;width:1px;background:var(--border)"></div>`).join('')}
      ${dots}
    </div>`;
}

const AccessPwd = {
  has() { return !!gGet('pw_access_pwd', null); },
  set(pwd) { gSet('pw_access_pwd', hashPwd('__access__', pwd)); },
  verify(pwd) { return this.has() && gGet('pw_access_pwd') === hashPwd('__access__', pwd); },
  clear() { gSet('pw_access_pwd', null); }
};
const AccessPwdGate = {
  show(onOk) {

      title: '🔒 访问密码',

        <div class="login-err" id="apg-err"></div>`,

      onMount(box) {
        const inp = box.querySelector('#apg-pwd');

        const ok = () => {
          if (!AccessPwd.verify(inp.value)) { err.textContent = '密码不正确'; inp.focus(); inp.select(); return; }
          sessionStorage.setItem('pw_pwd_ok', '1');
          Modal.close();
          onOk && onOk();

        box.querySelector('[data-apg-ok]').onclick = ok;
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
        setTimeout(() => inp.focus(), 80);

};

/* ==================================================================
 * 37.5 IndexedDB 辅助（视频/录音等大文件存储，绕过 localStorage 5MB 限制）
 * ================================================================== */
const IDB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    return new Promise((res, rej) => {
      const r = indexedDB.open('wb_db', 2);
      r.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('videos')) db.createObjectStore('videos', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('audios')) db.createObjectStore('audios', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('guitarvids')) db.createObjectStore('guitarvids', { keyPath: 'id' });
      };
      r.onsuccess = e => { this.db = e.target.result; res(this.db); };
      r.onerror = e => rej(e.target.error);
    });
  },
  async put(store, val) { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction(store, 'readwrite').objectStore(store).put(val); r.onsuccess = () => res(); r.onerror = e => rej(e.target.error); }); },
  async get(store, id) { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction(store, 'readonly').objectStore(store).get(id); r.onsuccess = () => res(r.result); r.onerror = e => rej(e.target.error); }); },
  async del(store, id) { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction(store, 'readwrite').objectStore(store).delete(id); r.onsuccess = () => res(); r.onerror = e => rej(e.target.error); }); },
  async getAll(store) { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction(store, 'readonly').objectStore(store).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = e => rej(e.target.error); }); }
};

 * ================================================================== */
const Planner = {
  data() { return DB.get('wb_planner', []); },
  save(d) { DB.set('wb_planner', d); },
  streak(d) {
    let s = 0;
    for (let i = 0; ; i++) {
      const day = addDays(todayStr(), -i);
      if (d.some(t => t.date === day && t.done)) s++;
      else if (i > 0) break;
    }
    return s;
  }
};
let PlanUI = { filter: 'today' };
Renderers.planner = () => {
  const all = Planner.data();
  const today = todayStr();
  const todayTasks = all.filter(t => t.date === today);
  const shown = PlanUI.filter === 'today' ? todayTasks
    : PlanUI.filter === 'done' ? all.filter(t => t.done).slice(-20).reverse()
    : all.slice(-30).reverse();
  const doneToday = todayTasks.filter(t => t.done).length;
  const totalToday = todayTasks.length;
  const streak = Planner.streak(all);
  // 7天完成率条形图
  const last7 = [];
  for (let i = 6; i >= 0; i--) {
    const day = addDays(today, -i);
    const td = all.filter(t => t.date === day);
    last7.push({ day: day.slice(5), done: td.filter(t => t.done).length, total: td.length });
  }
  const maxBar = Math.max(...last7.map(d => d.total), 1);
  return `

    <div class="card-title">📊 完成情况</div>
    <div class="flex gap-3 mb-2">
      <div class="stat"><b class="text-lg" style="color:var(--pri)">${streak}</b> <span class="small muted">连续打卡</span></div>
      <div class="stat"><b class="text-lg" style="color:var(--ok)">${doneToday}/${totalToday}</b> <span class="small muted">今日完成</span></div>
    </div>
    <div class="flex items-end gap-1" style="height:60px">
      ${last7.map(d => `<div class="flex-1 text-center">
        <div style="height:${(d.total ? (d.done / d.total) : 0) * 40}px;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px"></div>
        <div class="small muted" style="font-size:10px">${d.day}</div>
      </div>`).join('')}
    </div>
  </div>
  <div class="card">
    <div class="card-title">✅ 任务清单</div>
    <div class="flex gap-1 mb-2">
      ${[['today','今日'],['all','全部'],['done','已完成']].map(([k,n]) =>
        `<button class="chip ${PlanUI.filter === k ? 'on' : ''}" data-pl-filter="${k}">${n}</button>`
      ).join('')}

/* ==================================================================
 * 🔔 通知中心 + 定时提醒
 * Notify：系统通知(Notification API)，未授权/不支持时降级站内 toast
 * Reminders：自定义内容/时间/重复（一次/每天/工作日/每周），
 *   每 20 秒轮询；去重 key = id|date|HH:MM，同点只响一次
 * ================================================================== */
const Notify = {
  supported() { return 'Notification' in window; },
  permission() { return this.supported() ? Notification.permission : 'unsupported'; },
  // 必须在用户点击动作中调用
  async requestPermission() {
    if (!this.supported()) { Toast.show('当前浏览器不支持系统通知，会用站内提醒', 'warn'); return false; }
    if (Notification.permission === 'granted') return true;
    if (Notification.permission === 'denied') { Toast.show('通知权限被拒绝，可在浏览器站点设置里打开', 'warn'); return false; }
    try { return (await Notification.requestPermission()) === 'granted'; } catch (e) { return false; }
  },
  // 系统通知与站内 toast 互斥，避免双重打扰；opts: { body, tag, sound }
  push(title, opts = {}) {
    const soundOn = opts.sound !== false && gGet('pw_notify_sound', true);
    if (soundOn) this.beep();
    if (this.supported() && Notification.permission === 'granted' && gGet('pw_notify_enabled', true)) {
      try {
        const n = new Notification(title, { body: opts.body || '', tag: opts.tag || '', silent: !soundOn });
        n.onclick = () => { window.focus(); n.close(); };
        setTimeout(() => { try { n.close(); } catch (e) {} }, 9000);
        return 'notification';
      } catch (e) {}
    }
    Toast.show(title + (opts.body ? ' · ' + opts.body : ''), 'info');
    return 'toast';
  },
  // 双音提示音
  beep() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = new AC(), t = ctx.currentTime;
      [[880, 0], [1174.7, 0.18]].forEach(([f, d]) => {
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + d);
        g.gain.exponentialRampToValueAtTime(0.22, t + d + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.5);
        osc.connect(g).connect(ctx.destination);
        osc.start(t + d); osc.stop(t + d + 0.55);
      });
      setTimeout(() => { try { ctx.close(); } catch (e) {} }, 1200);
    } catch (e) {}
  }
};

const Reminders = {
  list() { return DB.get('wb_reminders', []); },
  save(l) { DB.set('wb_reminders', l); },
  timer: null,
  firedMem: new Set(),
  fkey(r, date, hm) { return `${r.id}|${date}|${hm}`; },
  add(r) {
    const l = this.list();
    l.push({ id: uid(), text: r.text, time: r.time, date: r.date || '',
      repeat: r.repeat, weekday: r.weekday === undefined ? null : r.weekday,
      enabled: true, fired: [] });
    this.save(l);
  },
  remove(id) { this.save(this.list().filter(r => r.id !== id)); },
  toggle(id) {
    const l = this.list(), r = l.find(x => x.id === id);
    if (r) r.enabled = !r.enabled;
    this.save(l);
    return r ? r.enabled : null;
  },
  applies(r, date, dow) {
    if (r.repeat === 'once') return r.date === date;
    if (r.repeat === 'daily') return true;
    if (r.repeat === 'weekdays') return dow >= 1 && dow <= 5;
    if (r.repeat === 'weekly') return r.weekday === dow;
    return false;
  },
  repeatLabel(r) {
    return { once: '一次', daily: '每天', weekdays: '工作日',
      weekly: '每周' + ['日','一','二','三','四','五','六'][r.weekday] }[r.repeat];
  },
  check() {
    const list = this.list();
    const now = new Date();
    const date = todayStr();
    const hm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    const dow = now.getDay();
    let changed = false;
    list.forEach(r => {
      if (!r.enabled || !this.applies(r, date, dow) || r.time > hm) return;
      const key = this.fkey(r, date, hm);
      if ((r.fired || []).includes(key) || this.firedMem.has(key)) return;
      Notify.push('⏰ ' + r.text, { body: `${this.repeatLabel(r)} · ${r.time} 提醒`, tag: r.id });
      this.firedMem.add(key);
      if (document.body.classList.contains('view-only')) return;
      r.fired = (r.fired || []).filter(k => k.split('|')[1] >= addDays(date, -7));
      r.fired.push(key);
      if (r.repeat === 'once') r.enabled = false;
      changed = true;
    });
    if (changed) this.save(list);
  },
  start() {
    if (this.timer) return;
    this.check();
    this.timer = setInterval(() => this.check(), 20000);
  }
};

      <div class="flex items-center gap-2 flex-wrap mb-2">
        <span class="small">${permText}</span>
        ${perm === 'default' ? '<button class="btn btn-pri btn-sm" id="ns-perm">开启通知权限</button>' : ''}
      </div>
      <div class="flex gap-2 flex-wrap mb-3">
        <button class="btn btn-sm ${enabled ? 'btn-pri' : ''}" id="ns-enabled">${enabled ? '🔔 系统通知：开' : '🔕 系统通知：关'}</button>
        <button class="btn btn-sm ${sound ? 'btn-pri' : ''}" id="ns-sound">${sound ? '🔊 提示音：开' : '🔇 提示音：关'}</button>
        <button class="btn btn-sm" id="ns-test">▶ 测试一条</button>
      </div>
      <div class="small muted mb-1">➕ 新建提醒</div>
      <input class="input mb-2" id="ns-text" maxlength="40" placeholder="提醒内容，如：背单词 / 去上课 / 喝水">
      <div class="flex gap-2 mb-2 flex-wrap">
        <input type="time" class="input" id="ns-time" value="08:00">
        <select class="input" id="ns-repeat">
          <option value="once">只提醒一次</option>
          <option value="daily" selected>每天</option>
          <option value="weekdays">工作日（周一至周五）</option>
          <option value="weekly">每周</option>
        </select>
      </div>
      <div class="flex gap-2 mb-2">
        <input type="date" class="input flex-1 hidden" id="ns-date">
        <select class="input flex-1 hidden" id="ns-weekday">
          <option value="1">周一</option><option value="2">周二</option><option value="3">周三</option>
          <option value="4">周四</option><option value="5">周五</option><option value="6">周六</option>
          <option value="0">周日</option>
        </select>
      </div>
      <button class="btn btn-pri w-full" id="ns-add">添加提醒</button>
      <div class="small muted mt-3 mb-1">📋 提醒列表（${rems.length}）</div>
      ${rems.length ? rems.map(r => `
        <div class="flex items-center gap-2 py-1.5 border-b" style="border-color:var(--border)">
          <button class="chip ${r.enabled ? 'on' : ''}" data-ns-toggle="${r.id}">${r.enabled ? '开' : '关'}</button>
          <b class="small" style="width:44px">${r.time}</b>
          <span class="flex-1 text-sm truncate">${esc(r.text)}</span>
          <span class="small muted">${Reminders.repeatLabel(r)}${r.repeat === 'once' ? ' ' + r.date : ''}</span>
          <button class="btn btn-sm btn-danger" data-ns-del="${r.id}">删</button>
        </div>`).join('') : '<div class="small muted">还没有提醒，添加一个吧</div>'}
      <p class="small muted mt-2">⏰ 到点自动弹通知；页面需保持打开，手机上建议"添加到主屏幕"使用。</p>`;
  },
  mount(box) {
    const card = box.querySelector('#settings-notify');
    if (!card) return;
    const refresh = () => SettingsUI.open();
    const p = card.querySelector('#ns-perm');
    if (p) p.onclick = async () => {
      const ok = await Notify.requestPermission();
      Toast.show(ok ? '已开启系统通知 🔔' : '未获得授权，会用站内提醒', ok ? 'success' : 'warn');
      refresh();
    };
    card.querySelector('#ns-enabled').onclick = () => { gSet('pw_notify_enabled', !gGet('pw_notify_enabled', true)); refresh(); };
    card.querySelector('#ns-sound').onclick = () => { gSet('pw_notify_sound', !gGet('pw_notify_sound', true)); refresh(); };
    card.querySelector('#ns-test').onclick = () => Notify.push('🔔 测试通知', { body: '通知功能正常，可以使用' });
    const rep = card.querySelector('#ns-repeat');
    const dateEl = card.querySelector('#ns-date'), wkEl = card.querySelector('#ns-weekday');
    dateEl.value = todayStr();
    const syncExtras = () => {
      dateEl.classList.toggle('hidden', rep.value !== 'once');
      wkEl.classList.toggle('hidden', rep.value !== 'weekly');
    };
    rep.onchange = syncExtras; syncExtras();
    card.querySelector('#ns-add').onclick = () => {
      const text = card.querySelector('#ns-text').value.trim();
      if (!text) { Toast.show('先写提醒内容', 'warn'); return; }
      const time = card.querySelector('#ns-time').value;
      if (!time) { Toast.show('选个提醒时间', 'warn'); return; }
      Reminders.add({ text, time, repeat: rep.value,
        date: dateEl.value || todayStr(), weekday: parseInt(wkEl.value, 10) });
      Toast.show('✅ 提醒已添加');
      refresh();
    };
    card.addEventListener('click', e => {
      const t = e.target.closest('[data-ns-toggle]');
      if (t) { Reminders.toggle(t.dataset.nsToggle); refresh(); return; }
      const d = e.target.closest('[data-ns-del]');
      if (d) { Reminders.remove(d.dataset.nsDel); Toast.show('已删除'); refresh(); }
    });
  }
};

/* ==================================================================
 * 37. 启动入口：账号判断 + 访问密码门 + 只读模式 → startApp 真正启动
 * ================================================================== */
// 真正启动应用：加载设置 → 主题 → 建页面 → 日更待办 → 首页 → 成就检查 → 引导
function startApp() {
  LoginGate.hide();
  // 只读模式（?view=1）跳过访问密码；否则已设密码且本会话未验证过则弹密码门
  const isView = document.body.classList.contains('view-only');
  if (!isView && AccessPwd.has() && !sessionStorage.getItem('pw_pwd_ok')) { AccessPwdGate.show(startApp); return; }
  Settings.load();
  Theme.init();
  Nav.buildPages();
  ensureDailyTodos();
  Nav.go('home', 'dash');
  Ach.check();
  Guide.maybe();
  Reminders.start();
  // 启动后自动同步云端（延迟 2 秒，等初始化完成）；CloudSync.init 挂载切后台立即上传
  if (!isView && CloudSync.enabled()) {
    CloudSync.init();
    setTimeout(() => CloudSync.sync().then(r => {
      if (r.status === 'pulled') {
        Toast.show('☁️ 已从云端同步最新数据，即将刷新', 'info');
        setTimeout(() => location.reload(), 1500);
      } else if (r.status === 'fail') {
        Toast.show('☁️ 云端同步失败（网络或 Token 问题），稍后可手动同步', 'warn');
      }
    }), 2000);
    // 管理后台埋点：延迟 3 秒上报（等云同步拉取完成后再上报）
    setTimeout(() => AdminLog.report(), 3000);
  }
}
// 入口：只读模式(?view=1 或 view.html)直接进；否则账号判断 + 访问密码门
function boot() {
  // 只读浏览模式：URL ?view=1，或文件名为 view.html，跳过登录/密码门
  const isViewFile = /(^|\/)view\.html$/i.test(location.pathname);
  if (isViewFile || new URLSearchParams(location.search).get('view') === '1') {
    document.body.classList.add('view-only');
    startApp();
    return;
  }
  Account.init();
  if (Account.current) startApp();
  else LoginGate.show('login');
}
// 等 DOM 就绪后启动
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

// Service Worker 注册：离线缓存 + 检测到新版自动刷新
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const newSw = reg.installing;
      newSw.addEventListener('statechange', () => {
        if (newSw.state === 'installed' && navigator.serviceWorker.controller) {
          // 有新版可用，自动刷新页面加载最新版
          setTimeout(() => location.reload(), 1500);
        }
      });
    });
    // 新 SW 激活后立即刷新一次（确保拿到最新 HTML）
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!refreshing) { refreshing = true; location.reload(); }
    });
  }).catch(() => {});
}

</script>
