<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111318">
<title>个人工作台 Pro · 本地版</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<!-- 性能优化：对常用外部站点提前做 DNS 解析 / 预连接，点开链接时省去握手等待 -->
<link rel="dns-prefetch" href="//www.douyin.com">
<link rel="preconnect" href="https://www.douyin.com" crossorigin>
<link rel="dns-prefetch" href="//www.bilibili.com">
<link rel="preconnect" href="https://www.bilibili.com" crossorigin>
<link rel="dns-prefetch" href="//www.xiaoyuzhoufm.com">
<link rel="preconnect" href="https://www.xiaoyuzhoufm.com" crossorigin>
<link rel="dns-prefetch" href="//www.youtube.com">
<link rel="preconnect" href="https://www.youtube.com" crossorigin>
<!-- TailwindCSS（CDN 版，需要联网加载一次；核心配色/组件样式为内置 CSS，不依赖 Tailwind 也能保证可读性） -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Tailwind 配置：class 模式暗色 + 品牌色
  if (window.tailwind) {
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { pri: '#f97316' } } }
    };
  }
</script>
<style>
/* ============ 主题变量（默认深色 + 橙色强调，可切换浅色/品牌色） ============ */
:root{
  --bg:#f4f5f7; --card:#ffffff; --bg2:#eef0f3; --text:#1e2430; --sub:#697180;
  --border:#e3e6ec; --pri:#f97316; --pri-soft:rgba(249,115,22,.12);
  --ok:#10b981; --err:#ef4444; --warn:#f59e0b; --blue:#3b82f6;
  --shadow:0 1px 3px rgba(0,0,0,.06);
}
html.dark{
  --bg:#0d0d0f; --card:#1c1c22; --bg2:#16161a; --text:#e8e8ed; --sub:#9a9aa6;
  --border:#2a2a33; --pri:#ff6b35; --pri-soft:rgba(255,107,53,.12);
  --shadow:0 4px 20px rgba(0,0,0,.4);
}
/* 品牌色选择：橙为默认（无 data-pri），其余 6 色由 Theme.setColor 切换 data-pri 属性 */
html[data-pri="blue"]{--pri:#3b82f6;--pri-soft:rgba(59,130,246,.14)}
html.dark[data-pri="blue"]{--pri:#60a5fa;--pri-soft:rgba(96,165,250,.18)}
html[data-pri="green"]{--pri:#10b981;--pri-soft:rgba(16,185,129,.14)}
html.dark[data-pri="green"]{--pri:#34d399;--pri-soft:rgba(52,211,153,.18)}
html[data-pri="purple"]{--pri:#8b5cf6;--pri-soft:rgba(139,92,246,.14)}
html.dark[data-pri="purple"]{--pri:#a78bfa;--pri-soft:rgba(167,139,250,.18)}
html[data-pri="pink"]{--pri:#ec4899;--pri-soft:rgba(236,72,153,.14)}
html.dark[data-pri="pink"]{--pri:#f472b6;--pri-soft:rgba(244,114,182,.18)}
html[data-pri="cyan"]{--pri:#06b6d4;--pri-soft:rgba(6,182,212,.14)}
html.dark[data-pri="cyan"]{--pri:#22d3ee;--pri-soft:rgba(34,211,238,.18)}
html[data-pri="red"]{--pri:#ef4444;--pri-soft:rgba(239,68,68,.14)}
html.dark[data-pri="red"]{--pri:#f87171;--pri-soft:rgba(248,113,113,.18)}
.theme-color-row{display:flex;gap:6px;flex-wrap:wrap}
.theme-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);background:var(--c);color:#fff;font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:transform .15s,box-shadow .15s}
.theme-dot:hover{transform:scale(1.1)}
.theme-dot.active{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c);border-color:transparent}
/* 只读浏览模式：顶部橙色 banner + 隐藏编辑/删除/清空按钮 + 禁用输入 */
body.view-only::before{content:'🔒 只读浏览模式 — 仅查看，不可编辑';display:block;position:sticky;top:0;z-index:60;background:var(--pri);color:#fff;text-align:center;padding:5px;font-size:12px;font-weight:700;letter-spacing:.5px}
body.view-only .btn-danger,
body.view-only [data-del],
body.view-only [data-of-itemdel],
body.view-only [data-phdel],
body.view-only [data-goal-del],
body.view-only [onclick*="清空"],
body.view-only [onclick*="wipe"],
body.view-only [onclick*="导出"],
body.view-only [onclick*="导入"],
body.view-only [onclick*="del"],
body.view-only [onclick*="remove"],
body.view-only [onclick*="删除"],
body.view-only [onclick*="移除"],
body.view-only #acc-logout,
body.view-only #acc-switch,
body.view-only #acc-login,
body.view-only [data-up],
body.view-only [data-down],
body.view-only [data-toggle]{display:none!important}
body.view-only input:not([type=range]):not([type=file]):not([type=checkbox]),body.view-only textarea,body.view-only select{background:var(--bg2)!important;pointer-events:none;color:var(--sub)}
body.view-only button[id*="save"],body.view-only button[id*="add"],body.view-only button[id*="set"],body.view-only button[id*="go"]:not([id*="tab"]){opacity:.5;pointer-events:none}
body.view-only #settings-access-pwd,body.view-only [onclick*="AccessPwdUI"]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.55}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ============ 通用组件类（减少模板里的重复样式） ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;user-select:none;white-space:nowrap}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn:active{transform:scale(.96)}
.btn-pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.btn-pri:hover{color:#fff;filter:brightness(1.08)}
.btn-danger{color:var(--err);border-color:transparent;background:transparent}
.btn-danger:hover{background:rgba(239,68,68,.1);border-color:var(--err);color:var(--err)}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input,select.input,textarea.input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--pri)}
textarea.input{resize:vertical;min-height:70px}
label.fl{display:block;font-size:12px;color:var(--sub);margin:8px 0 4px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;background:var(--bg2);border:1px solid var(--border);cursor:pointer;transition:all .15s;white-space:nowrap}
.chip.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri);font-weight:600}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;background:var(--pri-soft);color:var(--pri)}
.subtab{padding:6px 14px;border-radius:10px;font-size:13px;cursor:pointer;white-space:nowrap;border:1px solid transparent;color:var(--sub);transition:all .15s}
.subtab:hover{color:var(--text)}
.subtab.on{background:var(--card);color:var(--pri);border-color:var(--border);font-weight:600;box-shadow:var(--shadow)}
.side-item{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:2px 10px;border-radius:10px;cursor:pointer;color:var(--sub);transition:all .15s;text-decoration:none}
.side-item:hover{background:var(--bg2);color:var(--text)}
.side-item.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
.pri-dot{width:4px;border-radius:2px;align-self:stretch;flex-shrink:0}
.p1{background:var(--err)} .p2{background:var(--warn)} .p3{background:var(--blue)}
.progress{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
.progress>div{height:100%;background:var(--pri);border-radius:4px;transition:width .3s}
.hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.muted{color:var(--sub)}
.small{font-size:12px}
.stat-num{font-size:22px;font-weight:800;line-height:1.2}
.empty{text-align:center;color:var(--sub);padding:28px 10px;font-size:13px}
.empty .ico{font-size:34px;display:block;margin-bottom:6px;opacity:.7}

/* ============ 弹窗 / Toast / 动画 ============ */
#toast-root{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast-item{padding:9px 18px;border-radius:12px;font-size:13px;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.25);animation:tin .25s;max-width:86vw}
.toast-success{background:#10b981}.toast-error{background:#ef4444}.toast-info{background:#3b82f6}.toast-warn{background:#f59e0b}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadein .18s}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:520px;max-height:86vh;display:flex;flex-direction:column;animation:mup .2s}
.modal-box.wide{max-width:760px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700}
.modal-body{padding:16px 18px;overflow-y:auto}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes mup{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.fade-in{animation:fadein .25s}

/* ============ 布局 ============ */
#sidebar{width:236px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);height:100vh;position:sticky;top:0;overflow-y:auto;transition:width .2s}
#sidebar.collapsed{width:64px}
#sidebar.collapsed .side-item{justify-content:center;padding:8px 0;margin:2px 8px}
#mobilebar{display:none}
.bottom-sheet{position:fixed;inset:0;z-index:8000;display:none}
.bottom-sheet.open{display:block}
.sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-box{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:70vh;overflow-y:auto;animation:sup .25s}
@keyframes sup{from{transform:translateY(100%)}to{transform:none}}

/* ============ 移动端适配 ============ */
@media (max-width:768px){
  #sidebar{display:none}
  #mobilebar{display:flex}
  #main{padding:12px !important;padding-bottom:80px !important}
  .modal-box{max-width:100%}
  .grid-2{grid-template-columns:1fr !important}
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ============ 节拍器 ============ */
.metro-dot{width:26px;height:26px;border-radius:50%;background:var(--bg2);border:2px solid var(--border);transition:all .07s}
.metro-dot.hit{background:var(--pri);border-color:var(--pri);transform:scale(1.25)}
.metro-dot.accent{border-color:var(--pri)}
.metro-dot.accent.hit{background:var(--err);border-color:var(--err);transform:scale(1.35)}

/* ============ 成就徽章 ============ */
.ach{border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center;background:var(--card);transition:all .2s}
.ach.on{border-color:var(--warn);background:linear-gradient(135deg,var(--pri-soft),transparent);box-shadow:0 0 0 1px var(--warn) inset}
.ach .ico{font-size:30px;display:block;filter:grayscale(1);opacity:.45}
.ach.on .ico{filter:none;opacity:1}

/* ============ 打卡热区 ============ */
.heat{width:100%;aspect-ratio:1;border-radius:6px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--sub)}
.heat.lv1{background:var(--pri-soft)} .heat.lv2{background:rgba(249,115,22,.4)} .heat.lv3{background:var(--pri);color:#fff}

/* 视频占位（点击才加载 iframe，避免卡顿） */
.video-cover{position:relative;aspect-ratio:16/9;background:var(--bg2);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
/* 新手引导 */
.guide-fab{position:fixed;left:16px;bottom:76px;z-index:7000;width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ============ 日历（照片日历） ============ */
.cal-cell{aspect-ratio:1;border-radius:10px;position:relative;overflow:hidden;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s}
.cal-cell:hover{border-color:var(--pri)}
.cal-cell.today{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset}
.cal-cell .num{position:absolute;top:3px;left:6px;font-size:12px;z-index:2;font-weight:600}
.cal-cell img.thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cal-cell .cam{position:absolute;right:3px;bottom:2px;font-size:10px;z-index:3;background:rgba(0,0,0,.4);color:#fff;border-radius:6px;padding:0 4px}
.cal-blank{aspect-ratio:1}

/* ============ 登录/注册全屏页 ============ */
.login-gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;
 background:linear-gradient(140deg,#7c2d12 0%,#ea580c 55%,#fb923c 100%)}
.login-gate.hidden{display:none}
.login-card{background:#fff;color:#1f2937;width:100%;max-width:380px;border-radius:22px;padding:30px 26px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.login-card .linput{width:100%;border:1px solid #e5e7eb;border-radius:11px;padding:11px 14px;font-size:14px;outline:none;margin-top:6px;background:#fafafa}
.login-card .linput:focus{border-color:#f97316;background:#fff}
.login-card .lbtn{width:100%;border:none;border-radius:11px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;background:#f97316;color:#fff;transition:filter .15s}
.login-card .lbtn:hover{filter:brightness(1.07)}
.login-card .ltab{flex:1;text-align:center;padding:8px;font-size:14px;color:#9ca3af;cursor:pointer;border-bottom:2px solid transparent;font-weight:600}
.login-card .ltab.on{color:#ea580c;border-color:#f97316}
.login-err{color:#ef4444;font-size:12px;min-height:18px;margin-top:6px}
</style>
</head>
<body>

<!-- 登录/注册全屏页（未登录时显示，由 JS 渲染；游客可跳过） -->
<div id="login-gate" class="login-gate hidden"></div>

<div id="app" class="flex min-h-screen">
  <!-- 左侧导航（JS 生成） -->
  <aside id="sidebar"></aside>
  <div class="flex-1 flex flex-col min-w-0">
    <!-- 顶栏（JS 生成） -->
    <header id="topbar" class="sticky top-0 z-40" style="background:var(--card);border-bottom:1px solid var(--border)"></header>
    <!-- 主内容区：每个 Tab 一个 page，page 内只显示当前子模块面板，防止页面无限长 -->
    <main id="main" class="flex-1 p-4 md:p-6"><div id="pages"></div></main>
  </div>
</div>

<!-- 手机端底部导航（JS 生成） -->
<nav id="mobilebar" class="fixed bottom-0 left-0 right-0 z-40 items-center" style="background:var(--card);border-top:1px solid var(--border)"></nav>

<!-- 手机端全部模块底部弹窗 -->
<div id="sheet" class="bottom-sheet">
  <div class="sheet-mask" onclick="Sheet.close()"></div>
  <div class="sheet-box" id="sheet-box"></div>
</div>

<!-- 新手引导悬浮按钮（AI 助手已改为独立模块页面，不再常驻屏幕） -->
<button class="guide-fab" onclick="Guide.open()" title="新手引导">❓</button>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* ==================================================================
 * 个人工作台 Pro · 单文件本地版
 * 架构：DB(存储) → UI组件(Toast/Modal) → Nav(导航) → 各业务模块(Renderers)
 *      → Checkin(打卡联动中心) → Ach(成就引擎) → AI(本地模拟助手)
 * 所有数据存 localStorage（pw_ 前缀），支持 JSON 导出/导入备份。
 * ================================================================== */

/* ============ 1. 基础工具 ============ */
const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
// XSS 过滤：所有用户输入渲染前必须过 esc()
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtDate = ts => { const d = new Date(ts); return `${d.getMonth()+1}-${String(d.getDate()).padStart(2,'0')}`; };
const dayDiff = ds => Math.ceil((new Date(ds + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
const debounce = (fn, ms=300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const WEEK_CN = ['周日','周一','周二','周三','周四','周五','周六'];
const fmtFull = ds => { if(!ds) return ''; const d = new Date(ds + 'T00:00:00'); return `${ds.slice(5)} ${WEEK_CN[d.getDay()]}`; };
// 数字安全解析（空/非法返回 0）
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };

/* ============ 2. 存储层（pw_ 前缀约定防串站；登录账号后数据自动隔离） ============ */
// 全局区（账号注册表与会话，不随登录切换、不进业务数据备份）
function gGet(key, def) {
  try { const r = localStorage.getItem(key); return r === null ? def : JSON.parse(r); }
  catch (e) { return def; }
}
function gSet(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

/* ---- 账号系统（纯本地模拟，无后端）----
 * 账号信息存在全局区 pw_acc_accounts；密码用加盐哈希（本地简易保护，非金融级加密）。
 * 登录后业务数据全部写入该账号专属前缀，与游客/其他账号完全隔离。
 */
// 简易字符串哈希（djb2 变种），配合用户名做盐
function hashPwd(name, pwd) {
  const s = name.toLowerCase() + '#$' + pwd;
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = (((h << 5) + h) + s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
const Account = {
  current: null,   // {id,name}
  list: [],
  init() {
    this.list = gGet('pw_acc_accounts', []);
    const sid = gGet('pw_acc_session', null);
    this.current = this.list.find(a => a.id === sid) ? { id: sid, name: this.list.find(a => a.id === sid).name } : null;
  },
  // 注册：成功返回 null，失败返回错误文案
  register(name, pwd) {
    name = (name || '').trim();
    if (name.length < 2) return '用户名至少 2 个字符';
    if (!/^[\w一-龥]+$/.test(name)) return '用户名只能含中文、字母、数字、下划线';
    if ((pwd || '').length < 6) return '密码至少 6 位';
    if (this.list.some(a => a.name.toLowerCase() === name.toLowerCase())) return '这个用户名已经被注册了';
    const acc = { id: 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, pwdHash: hashPwd(name, pwd), createdAt: Date.now() };
    this.list.push(acc);
    gSet('pw_acc_accounts', this.list);
    gSet('pw_acc_session', acc.id);
    this.current = { id: acc.id, name: acc.name };
    return null;
  },
  login(name, pwd) {
    const acc = this.list.find(a => a.name.toLowerCase() === (name || '').trim().toLowerCase());
    if (!acc) return '没有这个账号，请先注册';
    if (acc.pwdHash !== hashPwd(acc.name, pwd)) return '密码不正确';
    gSet('pw_acc_session', acc.id);
    this.current = { id: acc.id, name: acc.name };
    return null;
  },
  logout() {
    gSet('pw_acc_session', null);
    this.current = null;
  },
  // 把游客数据（pw_wb_*）复制到当前账号名下（注册时一次性迁移）
  migrateGuest() {
    if (!this.current) return 0;
    let n = 0;
    Object.keys(localStorage).filter(k => k.startsWith('pw_wb_')).forEach(k => {
      localStorage.setItem('pw_u' + this.current.id + '_' + k.slice(3), localStorage.getItem(k));
      n++;
    });
    return n;
  },
  hasGuestData() { return Object.keys(localStorage).some(k => k.startsWith('pw_wb_')); }
};

// 构建版本号：部署时由 deploy_github.py 自动注入（设置 → 云同步 卡片显示，用于确认设备拿到最新版）
const APP_VER = '0924-1334';

const DB = {
  // 当前存储前缀：游客 pw_；登录账号 pw_u{账号id}_，各账号数据互不可见
  pref() { return Account.current ? `pw_u${Account.current.id}_` : 'pw_'; },
  get(key, def) {
    try { const r = localStorage.getItem(this.pref() + key); return r === null ? def : JSON.parse(r); }
    catch (e) { return def; }
  },
  set(key, val) {
    try {
      localStorage.setItem(this.pref() + key, JSON.stringify(val));
      localStorage.setItem(this.pref() + 'local_change', JSON.stringify(Date.now()));
      if (typeof CloudSync !== 'undefined') CloudSync.schedulePush();
      return true;
    } catch (e) { Toast.show('保存失败：浏览器存储空间可能已满（照片建议压缩），请导出备份后清理', 'error'); return false; }
  },
  del(key) { localStorage.removeItem(this.pref() + key); },
  // 汇总当前账号全部业务数据（导出备份用）；导出的 key 统一为 wb_xxx 形式
  dump() {
    const data = {}, p = this.pref();
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(p + 'wb_')) data[k.slice(p.length)] = localStorage.getItem(k);
    }
    return data;
  },
  // 导入备份（覆盖式），返回导入条数；自动兼容带历史前缀的旧备份
  restore(data) {
    let n = 0, p = this.pref();
    Object.entries(data).forEach(([k, v]) => {
      const nk = k.replace(/^pw_(u[^_]+_)?/, ''); // 去掉 pw_ 或 pw_uXXX_
      if (nk.startsWith('wb_')) { localStorage.setItem(p + nk, v); n++; }
    });
    return n;
  },
  usageKB() {
    let t = 0, p = this.pref();
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(p + 'wb_')) t += k.length + (localStorage.getItem(k) || '').length;
    }
    return Math.round(t / 1024);
  }
};

/* ============ 3. 反馈组件：Toast + Modal + 确认框 ============ */
const Toast = {
  show(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast-item toast-${type}`;
    el.textContent = msg;
    $('#toast-root').appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2200);
  }
};

const Modal = {
  current: null,
  // 打开弹窗：Modal.open({title, body, wide, foot, onMount(box)})
  open({ title, body, wide = false, foot = '', onMount }) {
    this.close();
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML = `
      <div class="modal-box ${wide ? 'wide' : ''}">
        <div class="modal-head"><span>${esc(title)}</span>
          <button class="btn btn-sm" data-close>✕</button></div>
        <div class="modal-body">${body}</div>
        ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
      </div>`;
    mask.addEventListener('click', e => { if (e.target === mask || e.target.closest('[data-close]')) this.close(); });
    $('#modal-root').appendChild(mask);
    this.current = mask;
    if (onMount) onMount(mask);
    return mask;
  },
  close() { if (this.current) { this.current.remove(); this.current = null; } }
};

const Dialog = {
  // 二次确认框：Dialog.confirm({title,text,danger}) → Promise<boolean>
  confirm({ title = '确认操作', text = '', okText = '确认', danger = false } = {}) {
    return new Promise(resolve => {
      Modal.open({
        title,
        body: `<p style="color:var(--sub)">${text}</p>`,
        foot: `<button class="btn" data-no>取消</button>
               <button class="btn ${danger ? 'btn-danger' : 'btn-pri'}" data-ok style="${danger ? 'border-color:var(--err)' : ''}">${esc(okText)}</button>`,
        onMount(box) {
          box.querySelector('[data-ok]').onclick = () => { Modal.close(); resolve(true); };
          box.querySelector('[data-no]').onclick = () => { Modal.close(); resolve(false); };
        }
      });
    });
  }
};

const Renderers = {};
const AfterRender = {}; // 渲染后的挂载逻辑（绑定事件等）：AfterRender[mid] = (el) => {}

const Settings = {
  data: null,
  load() { this.data = DB.get('wb_settings', { hidden: [], order: [], onboarded: false }); },
  save() { DB.set('wb_settings', this.data); },
  isHidden(id) { return !MOD_MAP[id]?.fixed && this.data.hidden.includes(id); },
  // 某个 Tab 下按用户排序、过滤隐藏后的模块
  modulesOf(tabId) {
    const list = MODULES.filter(m => m.tab === tabId && !this.isHidden(m.id));
    const ord = this.data.order;
    list.sort((a, b) => {
      const ia = ord.indexOf(a.id), ib = ord.indexOf(b.id);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });
    return list;
  }
};

const Nav = {
  curTab: 'home',
  curMod: 'dash',
  // 初始化：生成所有 page 容器（每个 page 含子标签栏 + 面板容器）
  buildPages() {
    $('#pages').innerHTML = TABS.map(t => `
      <div id="page-${t.id}" class="hidden">
        <div id="subtabs-${t.id}" class="flex gap-1 overflow-x-auto pb-3 mb-1" style="background:var(--bg);position:sticky;top:0;z-index:10"></div>
        <div id="panels-${t.id}"></div>
      </div>`).join('');
  },
  // 切换到某 Tab 的某模块
  go(tabId, modId) {
    const mods = Settings.modulesOf(tabId);
    if (!modId || Settings.isHidden(modId)) modId = mods[0]?.id;
    if (!MOD_MAP[modId]) return;
    this.curTab = tabId; this.curMod = modId;
    TABS.forEach(t => $('#page-' + t.id).classList.toggle('hidden', t.id !== tabId));
    // 渲染子标签栏
    const bar = $('#subtabs-' + tabId);
    if (bar) {
      bar.innerHTML = mods.map(m =>
        `<div class="subtab ${m.id === modId ? 'on' : ''}" data-goto="${m.id}">${m.icon} ${esc(m.name)}</div>`).join('');
      $$('.subtab', bar).forEach(el => el.onclick = () => Nav.go(tabId, el.dataset.goto));
    }
    this.renderPanel(modId);
    this.renderSide(); this.renderTop(); this.renderMobile();
    Sheet.close();
    window.scrollTo({ top: 0 });

  // 渲染单个模块面板（每次切换重新渲染，保证数据最新）
  renderPanel(modId) {
    const box = $('#panels-' + this.curTab);

    box.innerHTML = `<section id="panel-${modId}" class="fade-in">${(Renderers[modId] || (() => '<div class="empty">模块开发中</div>'))()}</section>`;

          <div class="card-title">☁️ 云同步 <span class="small muted font-normal">（手机电脑数据互通）</span></div>
          ${this.cloudSyncHTML()}
        </div>
        <div class="card !p-3 mb-3">
          <div class="card-title">💾 数据备份 <span class="small muted font-normal">（已用 ${DB.usageKB()} KB）</span></div>
          <div class="flex gap-2 flex-wrap">
            <button class="btn btn-pri" onclick="Backup.exportData()">⬇️ 导出全部数据(JSON)</button>
            <button class="btn" onclick="$('#import-file').click()">⬆️ 导入备份文件</button>
            <input type="file" id="import-file" accept=".json" class="hidden">
          </div>
          <p class="small muted mt-2">建议每周导出一次备份；换设备/清缓存前务必先导出。导入为覆盖式恢复。</p>
        </div>
        <div class="card !p-3" style="border-color:var(--err)">

      onMount(box) {

        const logout = async () => {

          if (!ok) return;

        const loBtn = box.querySelector('#acc-logout'), swBtn = box.querySelector('#acc-switch');
        if (loBtn) loBtn.onclick = logout;
        if (swBtn) swBtn.onclick = logout;

        if (liBtn) liBtn.onclick = () => location.reload(); // 游客 → 刷新后自动出现登录门

            const h = Settings.data.hidden, i = h.indexOf(id);
            if (i === -1) { h.push(id); Toast.show('已隐藏模块，可随时在设置中恢复', 'info'); } else { h.splice(i, 1); }

        // 云同步（事件委托，renderCloudSync 刷新内容后事件仍然有效）

            btn.textContent = '连接中...'; btn.disabled = true;

              Toast.show(res.pulled ? '✅ 已连接云端，正在加载其他设备的数据...' : '✅ 云同步已连接！');

              if (res.pulled) setTimeout(() => location.reload(), 1500);

          } else if (e.target.closest('#cs-sync-now')) {

  // 模块管理列表：按板块分组，组内按当前 order 排列
  modRowsHTML() {
    const s = Settings.data;
    const pos = id => { const i = s.order.indexOf(id); return i === -1 ? 9999 : i; };
    return TABS.map(t => {
      const mods = MODULES.filter(m => m.tab === t.id && !m.fixed).sort((a, b) => pos(a.id) - pos(b.id));
      if (!mods.length) return '';
      return `<div class="small muted mt-3 mb-1">📂 ${esc(t.name)}</div>` + mods.map(m => {
        const hidden = s.hidden.includes(m.id);
        return `<div class="flex items-center gap-2 py-1.5" data-mod="${m.id}">
          <span class="w-6 text-center">${m.icon}</span>

          <button class="btn btn-sm" data-down title="下移">↓</button>
          <button class="chip ${hidden ? '' : 'on'}" data-toggle>${hidden ? '已隐藏' : '显示中'}</button>
        </div>`;
      }).join('');
    }).join('');
  },
  // 排序：只在【同板块】内与相邻模块交换（修旧版跨板块交换导致侧栏毫无变化的 bug）
  move(mgrEl, id, dir) {
    const order = Settings.data.order;
    // 规范化的当前全局顺序：未排过序的模块按注册顺序补在后面
    const globalOrder = MODULES.filter(m => !m.fixed).map(m => m.id)
      .sort((x, y) => (order.indexOf(x) === -1 ? 9999 : order.indexOf(x)) -
                      (order.indexOf(y) === -1 ? 9999 : order.indexOf(y)));
    const tabId = MOD_MAP[id].tab;
    const peers = globalOrder.filter(x => MOD_MAP[x].tab === tabId);
    const idx = peers.indexOf(id), j = idx + dir;
    if (idx === -1 || j < 0 || j >= peers.length) {
      Toast.show(dir < 0 ? '已经是该板块最上面了' : '已经是该板块最下面了', 'warn');
      return;
    }
    const other = peers[j];
    const a = globalOrder.indexOf(id), b = globalOrder.indexOf(other);
    [globalOrder[a], globalOrder[b]] = [globalOrder[b], globalOrder[a]];
    Settings.data.order = globalOrder;
    Settings.save();
    mgrEl.innerHTML = this.modRowsHTML();
    Nav.go(Nav.curTab, Nav.curMod);
    Toast.show('✅ 排序已更新');

        <div class="flex gap-2 flex-wrap">
          <button class="btn btn-pri" id="cs-sync-now">🔄 立即同步</button>
          <a class="btn" href="https://gist.github.com/${CloudSync.gistId()}" target="_blank" rel="noopener noreferrer">📋 查看后台</a>
          <button class="btn btn-danger" id="cs-disconnect">断开</button>
        </div>
        <p class="small muted mt-2">版本 <b>${APP_VER}</b> · 云端仓库尾号 <b>…${(CloudSync.gistId() || '').slice(-6)}</b> · 上次同步 <b>${CloudSync.lastSync() ? new Date(CloudSync.lastSync()).toLocaleString('sv') : '从未'}</b></p>
        ${(() => {

          if (!st) return '';

/* ============ 7. 数据备份：导出 / 导入 / 清空 ============ */
const Backup = {
  exportData() {
    const payload = { app: 'workbench-pro', version: 1, exportedAt: new Date().toISOString(), data: DB.dump() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `workbench-backup-${todayStr().replace(/-/g, '')}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    Toast.show('备份文件已导出，请妥善保存');
  },
  importData(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const json = JSON.parse(reader.result);
        if (!json || typeof json.data !== 'object') throw new Error('格式不对');
        const ok = await Dialog.confirm({
          title: '导入备份', danger: true,
          text: `备份时间：${json.exportedAt || '未知'}<br>包含 ${Object.keys(json.data).length} 项数据。<br><b style="color:var(--err)">导入将覆盖当前全部数据</b>，确定继续吗？`,
          okText: '覆盖导入'
        });
        if (!ok) return;
        const n = DB.restore(json.data);
        Toast.show(`已导入 ${n} 项数据，即将刷新页面`);
        setTimeout(() => location.reload(), 1200);
      } catch (err) { Toast.show('导入失败：不是有效的备份文件', 'error'); }
    };
    reader.readAsText(file);
  },
  async wipe() {
    const scope = Account.current ? `账号「${esc(Account.current.name)}」的` : '游客';
    const ok = await Dialog.confirm({ title: '清空全部数据', danger: true, text: `${scope}所有模块数据都将被<b>永久删除</b>！建议先导出备份。真的要清空吗？`, okText: '全部清空' });
    if (!ok) return;
    const ok2 = await Dialog.confirm({ title: '最后确认', danger: true, text: '再次确认：真的要清空吗？此操作不可撤销。', okText: '我确定' });
    if (!ok2) return;
    // 只清理当前账号前缀下的业务数据，不影响其他账号与账号本身
    const pre = DB.pref() + 'wb_';
    Object.keys(localStorage).filter(k => k.startsWith(pre)).forEach(k => localStorage.removeItem(k));
    Toast.show('已清空，即将刷新');
    setTimeout(() => location.reload(), 1000);
  }
};

/* ============ 7.5 云同步：GitHub Gist 自动同步（手机电脑数据互通） ============ */
const CloudSync = {
  _timer: null,
  FILE: 'workbench-data.json',
  token() { return gGet('pw_gist_token', ''); },
  gistId() { return gGet('pw_gist_id', ''); },
  enabled() { return !!this.token() && !!this.gistId(); },
  lastSync() { return gGet('pw_gist_last', 0); },
  localMs() { const p = DB.pref(); const r = localStorage.getItem(p + 'local_change'); return r ? JSON.parse(r) : 0; },
  gistUrl() { return this.gistId() ? `https://gist.github.com/${this.gistId().slice(0, 20)}` : ''; },
  // 验证 token 并创建/复用 Gist
  async setup(token) {
    token = (token || '').trim();
    if (!token) return '请粘贴 GitHub Token';
    const r = await fetch('https://api.github.com/user', {
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (r.status === 401) return 'Token 无效或已过期，请重新生成';
    if (!r.ok) return '验证失败（HTTP ' + r.status + '）';
    const scopes = r.headers.get('x-oauth-scopes') || '';
    if (!scopes.includes('gist')) return 'Token 缺少 gist 权限，请重新生成（勾选 gist）';

    // 先搜索是否已有工作台数据 Gist（其他设备创建的），有则复用
    let gistId = '', foundExisting = false;
    const lr = await fetch('https://api.github.com/gists?per_page=100', {
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (lr.ok) {
      const gists = await lr.json();
      // 如果有多个，选最近更新的那个
      const matches = gists.filter(g => g.files && g.files[this.FILE]);
      if (matches.length) {
        matches.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
        gistId = matches[0].id;
        foundExisting = true;
      }
    }

    // 如果已有 Gist，先拉取云端数据恢复到本地（确保新设备拿到老设备的数据）
    if (gistId) {
      const pr = await fetch(`https://api.github.com/gists/${gistId}`, {
        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
      });
      if (pr.ok) {
        const g = await pr.json();
        const f = g.files[this.FILE];
        if (f && f.content) {
          try {
            const cloud = JSON.parse(f.content);
            if (cloud.data) DB.restore(cloud.data);
            localStorage.setItem(DB.pref() + 'local_change', JSON.stringify(cloud.localMs || Date.now()));
          } catch (e) {}
        }
      }
    } else {
      // 没有就新建
      const payload = {
        description: '个人工作台数据同步（自动生成，请勿手动删除）',
        public: false,
        files: { [this.FILE]: { content: JSON.stringify({ version: 1, data: DB.dump(), updatedAt: new Date().toISOString(), account: Account.current?.name || 'guest', localMs: Date.now() }, null, 2) } }
      };
      const gr = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
        body: JSON.stringify(payload)
      });
      if (!gr.ok) return '创建 Gist 失败（HTTP ' + gr.status + '）';
      const g = await gr.json();
      gistId = g.id;
    }

    gSet('pw_gist_token', token);
    gSet('pw_gist_id', gistId);
    gSet('pw_gist_last', Date.now());
    gSet('pw_sync_status', { ok: true, msg: '已连接', ts: Date.now() });
    if (!this.localMs()) localStorage.setItem(DB.pref() + 'local_change', JSON.stringify(Date.now()));
    return { err: null, pulled: !!foundExisting };
  },
  // 推送本地数据到云端
  async push() {
    if (!this.enabled()) return false;
    try {
      const payload = { version: 1, data: DB.dump(), updatedAt: new Date().toISOString(), account: Account.current?.name || 'guest', localMs: Date.now() };
      const r = await fetch(`https://api.github.com/gists/${this.gistId()}`, {
        method: 'PATCH',
        headers: { 'Authorization': `token ${this.token()}`, 'Accept': 'application/vnd.github.v3+json' },
        body: JSON.stringify({ files: { [this.FILE]: { content: JSON.stringify(payload, null, 2) } } })
      });
      if (!r.ok) {
        gSet('pw_sync_status', { ok: false, msg: r.status === 401 || r.status === 403 ? 'Token 已失效，自动上传被拒绝' : '自动上传失败（HTTP ' + r.status + '）', ts: Date.now() });
        return false;
      }
      gSet('pw_gist_last', Date.now());
      localStorage.setItem(DB.pref() + 'local_change', JSON.stringify(Date.now()));
      gSet('pw_sync_status', { ok: true, msg: '已自动上传', ts: Date.now() });
      return true;
    } catch (e) {
      gSet('pw_sync_status', { ok: false, msg: '网络不通，自动上传失败', ts: Date.now() });
      return false;
    }
  },
  // 智能同步（记录状态供设置页常驻显示）
  async sync() {
    const r = await this._sync();
    gSet('pw_sync_status', { ok: r.status === 'pulled' || r.status === 'pushed' || r.status === 'in-sync', status: r.status, msg: r.msg, ts: Date.now() });
    return r;
  },
  async _sync() {
    if (!this.enabled()) return { status: 'disabled', msg: '云同步未开启' };
    await this.reconcile(); // 先对账，确保指向账号下最新的 Gist
    const r = await fetch(`https://api.github.com/gists/${this.gistId()}`, {
      headers: { 'Authorization': `token ${this.token()}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (r.status === 401 || r.status === 403) return { status: 'fail', msg: 'Token 已失效！请到 GitHub 重新生成 Token，在云同步里断开后用新 Token 重连' };
    if (!r.ok) return { status: 'fail', msg: '连接 GitHub 失败（HTTP ' + r.status + '），请检查网络' };
    const g = await r.json();
    const f = g.files[this.FILE];
    if (!f || !f.content) return { status: 'fail', msg: '云端还没有数据，稍后会自动上传本地数据' };
    let cloud;
    try { cloud = JSON.parse(f.content); } catch (e) { return { status: 'fail', msg: '云端数据格式异常，请到「查看后台」检查' }; }
    const cloudMs = cloud.localMs || 0;
    const localMs = this.localMs();
    if (cloudMs > localMs + 2000) { // 云端更新（2 秒容差）
      DB.restore(cloud.data);
      localStorage.setItem(DB.pref() + 'local_change', JSON.stringify(cloudMs));
      gSet('pw_gist_last', Date.now());
      return { status: 'pulled', msg: '已从云端拉取最新数据' };
    } else if (localMs > cloudMs + 2000) { // 本地更新
      const ok = await this.push();
      return { status: ok ? 'pushed' : 'fail', msg: ok ? '本地数据已上传云端' : '上传失败，请稍后重试' };
    } else {
      gSet('pw_gist_last', Date.now());
      return { status: 'in-sync', msg: '本地与云端已一致，无需同步' };
    }
  },
  // 防抖上传：数据变动后 3 秒自动上传（只读模式不上传）
  schedulePush() {
    if (!this.enabled()) return;
    if (document.body.classList.contains('view-only')) return;
    if (this._timer) clearTimeout(this._timer);
    this._timer = setTimeout(() => {
      this._timer = null;
      this.push();
    }, 1500);
  },
  // 启动挂载：页面切到后台时立即上传（防止用户改完数据马上关页面导致改动丢失）
  init() {
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this._timer) { clearTimeout(this._timer); this._timer = null; this.push(); }
    });
  },
  // 对账：自动指向账号下最新的工作台 Gist（修复多设备各自连了不同旧 Gist 导致不同步）
  async reconcile() {
    const token = this.token();
    if (!token) return;
    try {
      const lr = await fetch('https://api.github.com/gists?per_page=100', {
        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
      });
      if (!lr.ok) return;
      const matches = (await lr.json()).filter(g => g.files && g.files[this.FILE]);
      if (!matches.length) return;
      matches.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
      const best = matches[0].id;
      if (best && best !== this.gistId()) gSet('pw_gist_id', best);
    } catch (e) {}
  },
  disconnect() {
    localStorage.removeItem('pw_gist_token');
    localStorage.removeItem('pw_gist_id');
    localStorage.removeItem('pw_gist_last');
    localStorage.removeItem('pw_sync_status');
    localStorage.removeItem(DB.pref() + 'local_change');
  }
};

/* ============ 7.6 管理后台埋点：自动上报浏览记录/账号信息到管理 Gist ============ */
const AdminLog = {
  _reported: false,
  // 用当前用户的云同步 Token 上报到管理 Gist
  // 管理 Gist 的 ID 约定：首次上报时自动创建，文件名 wb-logs.json / wb-accounts.json
  _adminGistId: null,

  async _getOrCreateGist() {
    // 复用用户自己的 token（如果有云同步配置）
    const token = CloudSync.token();
    if (!token) return null;

    // 尝试读取已保存的管理 Gist ID
    let id = gGet('pw_admin_gist', '');
    if (id) {
      // 验证是否可访问
      const r = await fetch(`https://api.github.com/gists/${id}`, {
        headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
      });
      if (r.ok) { this._adminGistId = id; return id; }
    }

    // 查找已有管理 Gist（文件名 wb-logs.json）
    const lr = await fetch('https://api.github.com/gists?per_page=100', {
      headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (lr.ok) {
      const gists = await lr.json();
      const found = gists.find(g => g.files && g.files['wb-logs.json']);
      if (found) {
        gSet('pw_admin_gist', found.id);
        this._adminGistId = found.id;
        return found.id;
      }
    }

    // 创建新的管理 Gist
    const r = await fetch('https://api.github.com/gists', {
      method: 'POST',
      headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' },
      body: JSON.stringify({
        description: '工作台管理后台日志（自动生成）',
        public: false,
        files: {
          'wb-logs.json': { content: JSON.stringify({ visits: [] }, null, 2) },
          'wb-accounts.json': { content: JSON.stringify([], null, 2) }
        }
      })
    });
    if (!r.ok) return null;
    const g = await r.json();
    gSet('pw_admin_gist', g.id);
    this._adminGistId = g.id;
    return g.id;
  },

  async _readFile(id, name) {
    const r = await fetch(`https://api.github.com/gists/${id}`, {
      headers: { Authorization: `token ${CloudSync.token()}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (!r.ok) return null;
    const g = await r.json();
    const f = g.files[name];
    return (f && f.content) ? JSON.parse(f.content) : null;
  },

  async _writeFile(id, name, data) {
    const r = await fetch(`https://api.github.com/gists/${id}`, {
      method: 'PATCH',
      headers: { Authorization: `token ${CloudSync.token()}`, Accept: 'application/vnd.github.v3+json' },
      body: JSON.stringify({ files: { [name]: { content: JSON.stringify(data, null, 2) } } })
    });
    return r.ok;
  },

  // 上报一次访问
  async report() {
    if (this._reported) return;
    this._reported = true;
    try {
      const id = await this._getOrCreateGist();
      if (!id) return;
      const token = CloudSync.token();
      if (!token) return;

      // 读取现有数据
      const [logs, accounts] = await Promise.all([
        this._readFile(id, 'wb-logs.json'),
        this._readFile(id, 'wb-accounts.json')
      ]);

      // 检测设备类型
      const ua = navigator.userAgent;
      const device = /Mobile|Android|iPhone|iPad/.test(ua) ? '📱手机' : '💻电脑';
      const now = new Date();
      const timeStr = now.toLocaleString('sv');
      const userName = Account.current?.name || '游客';
      const userId = Account.current?.id || 'guest';

      // 追加访问记录（保留最近 500 条）
      const visits = (logs && logs.visits) || [];
      visits.push({ time: timeStr, ts: now.getTime(), user: userName, uid: userId, device, page: 'workbench' });
      if (visits.length > 500) visits.splice(0, visits.length - 500);
      await this._writeFile(id, 'wb-logs.json', { visits });

      // 更新账号列表
      const accs = accounts || [];
      const idx = accs.findIndex(a => a.id === userId);
      // 统计当前账号数据量
      const dump = DB.dump();
      const dataKeys = Object.keys(dump).length;
      const dataSize = Math.round(JSON.stringify(dump).length / 1024) + 'KB';
      const accInfo = {
        id: userId, name: userName,
        createdAt: idx >= 0 ? accs[idx].createdAt : timeStr,
        lastActive: timeStr, lastTs: now.getTime(),
        dataKeys, dataSize,
        lastSync: CloudSync.enabled() ? new Date(CloudSync.lastSync()).toLocaleString('sv') : '未开启'
      };
      if (idx >= 0) accs[idx] = { ...accs[idx], ...accInfo };
      else accs.push(accInfo);
      await this._writeFile(id, 'wb-accounts.json', accs);
    } catch (e) { /* 静默失败，不影响用户使用 */ }
  }
};

/* ============ 9. 视频链接解析（B站/YouTube 内嵌播放） ============ */
function parseVideoUrl(url) {
  url = (url || '').trim();
  if (!url) return null;
  let m;
  // B站：BV 号（www.bilibili.com/video/BVxxxx 或直接 BVxxxx）
  if (m = url.match(/BV[0-9A-Za-z]{8,12}/)) {
    return { source: 'bilibili', embed: `https://player.bilibili.com/player.html?bvid=${m[0]}&autoplay=0&high_quality=1`, link: `https://www.bilibili.com/video/${m[0]}` };
  }
  // YouTube：watch?v= / youtu.be/ / shorts/
  if (m = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([\w-]{6,20})/)) {
    return { source: 'youtube', embed: `https://www.youtube.com/embed/${m[1]}`, link: `https://www.youtube.com/watch?v=${m[1]}` };
  }
  // 抖音：v.douyin.com 短链 / www.douyin.com/video|note/ID / iesdouyin 分享页
  if (/douyin\.com|iesdouyin\.com/i.test(url)) {
    const idM = url.match(/\/(?:video|note)\/(\d+)/);
    return { source: 'douyin', embed: null, link: url, awemeId: idM ? idM[1] : '' };
  }
  return { source: 'web', embed: null, link: url };
}

/* 解析「抖音分享文本」：形如
 * "0.78 https://v.douyin.com/iABCdeF/ 复制此链接，打开Dou音…" 或带 【标题】 的长文本
 * 返回 {url, id, title}；非抖音链接返回 null
 */
function parseDouyinShare(text) {
  text = String(text || '');
  const m = text.match(/https?:\/\/[^\s，。<>【】]+/);
  if (!m || !/douyin\.com|iesdouyin\.com/i.test(m[0])) return null;
  let url = m[0];
  const idM = url.match(/\/(?:video|note)\/(\d+)/);
  const tM = text.match(/【([^】]+)】/);
  return { url, id: idM ? idM[1] : '', title: tM ? tM[1].trim() : '' };
}
/* 解析「汽水音乐分享文本」：汽水音乐/抖音分享整段文案里抽 URL + 歌名
 * 汽水音乐分享域名较杂（含 douyin 短链等），这里宽松提取任意 http 链接 + 【歌名】
 * 返回 {url, title}；无 URL 返回 null
 */
function parseQishuiShare(text) {
  text = String(text || '');
  const m = text.match(/https?:\/\/[^\s，。<>【】]+/);
  if (!m) return null;
  const tM = text.match(/【([^】]+)】/) || text.match(/《([^》]+)》/);
  return { url: m[0], title: tM ? tM[1].trim() : '' };
}

/* ============ 9.5 外部 App 唤起引擎（URL Scheme + 兜底，纯前端） ============
 * 用法：DeepLink.open(Apps.bbdc) 或 DeepLink.open({scheme,url,iosId,androidPkg,name,path})
 * 手机：先尝试 App Scheme；1.6 秒内没切走 App 就跳网页/应用商店（自动检测，离开页面时取消计时）
 * 电脑：直接打开网页版
 */
const DeepLink = {
  ua: navigator.userAgent,
  isIOS: /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  isAndroid: /Android/i.test(navigator.userAgent),
  get isMobile() { return this.isIOS || this.isAndroid; },

  open(cfg) {
    const name = cfg.name || 'App';
    // 桌面端：直接新标签打开网页，最快
    if (!this.isMobile) {
      window.open(cfg.url, '_blank', 'noopener');
      Toast.show(`已打开${name}网页版；手机上可直接唤起App`, 'info');
      return;
    }
    // 手机端：逐级尝试唤起，全部失败才去下载页
    // Android 首选 intent://（带包名，已安装直接打开且不弹选择框；Chrome/Edge 未安装会自动走 fallback_url）
    const storeUrl = this.isIOS && cfg.iosId ? `https://apps.apple.com/cn/app/id${cfg.iosId}`
      : (!this.isIOS && cfg.androidPkg) ? `https://sj.qq.com/appdetail/${cfg.androidPkg}`
      : cfg.url;
    const steps = [];
    if (this.isAndroid && cfg.androidPkg && cfg.scheme) {
      const schemeName = cfg.scheme.replace(/:\/?\/?$/, '');
      steps.push(`intent://open/#Intent;scheme=${schemeName};package=${cfg.androidPkg};S.browser_fallback_url=${encodeURIComponent(storeUrl)};end`);
    }
    if (cfg.scheme) steps.push(cfg.scheme + (cfg.path || ''));
    steps.push(storeUrl);
    let settled = false, idx = 0, timer = null;
    const onHide = () => { if (document.hidden) { settled = true; clearTimeout(timer); document.removeEventListener('visibilitychange', onHide); } };
    document.addEventListener('visibilitychange', onHide);
    const next = () => {
      if (settled) return;
      idx++;
      if (idx >= steps.length) { settled = true; document.removeEventListener('visibilitychange', onHide); return; }
      window.location.href = steps[idx];
      timer = setTimeout(next, 1800);
    };
    timer = setTimeout(next, 1800);
    window.location.href = steps[0];
  }
};

/* SmartLink：收藏夹等处的链接全平台通用打开器
   电脑：新标签打开网页；手机：识别链接归属 App，先唤起 App（失败 1.8 秒后自动回网页）

const SmartLink = {
  open(url) {
    url = String(url || '');

    const cfg = { name: '链接', url };

    if (bv) cfg.scheme = 'bilibili://video/' + bv[1]; // 唤不起时 DeepLink 自动回退打开原网页
    DeepLink.open(cfg);
  }
};

/* ==================================================================
 * 10. 统一打卡联动中心：舞蹈/练声/四级/养生 打卡 →
 *     ① 写入打卡日志  ② 自动完成今日待办  ③ 刷新成就  ④ 仪表盘可看
 * ================================================================== */
const CHECK_MODULES = {
  dance:    { name: '💃 爵士舞打卡', icon: '💃' },
  vocal:    { name: '🎤 练声打卡',   icon: '🎤' },
  guitar:   { name: '🎸 吉他练琴',   icon: '🎸' },
  cet:      { name: '📘 四级学习',   icon: '📘' },
  wellness: { name: '🌿 养生打卡',   icon: '🌿' }
};

const Checkin = {
  all() { return DB.get('wb_checkins', {}); },
  today() { return this.all()[todayStr()] || {}; },
  isDone(mod) { return !!this.today()[mod]?.done; },
  // 记录一次打卡（minutes 可选，note 训练感受）
  record(mod, { minutes = 0, note = '' } = {}) {
    if (!CHECK_MODULES[mod]) return;
    const logs = this.all();
    const t = todayStr();
    logs[t] = logs[t] || {};
    const prev = logs[t][mod] || {};
    logs[t][mod] = { done: true, minutes: Math.round(num(minutes) + num(prev.minutes)), note: note || prev.note || '', ts: Date.now() };
    DB.set('wb_checkins', logs);
    this.syncTodo(mod, logs[t][mod]);
    Ach.check();
    if (Nav.curMod === 'dash') Nav.refresh();
  },
  // 打卡 → 自动完成今日待办里对应任务（没有则自动创建一条已完成记录）
  syncTodo(mod, info) {
    const todos = DB.get('wb_todos', []);
    let todo = todos.find(x => x.auto === mod && !x.archived);
    if (todo) {
      if (!todo.done) { todo.done = true; todo.doneAt = Date.now(); }
      if (info?.note) todo.note = info.note;
    } else {
      todos.unshift({
        id: uid(), text: CHECK_MODULES[mod].name, priority: 2, due: todayStr(),
        tags: ['打卡'], repeat: 'daily', auto: mod,
        done: true, doneAt: Date.now(), createdAt: Date.now(), archived: false,
        note: info?.note || ''
      });
    }
    DB.set('wb_todos', todos);
  }
};

/* ============ 11. 全局统计（仪表盘 & 成就共用） ============ */
const Stats = {
  // 连续打卡天数（任一训练模块完成即算）
  streak() {
    const logs = Checkin.all();
    let n = 0;
    const d = new Date();
    for (;;) {
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const day = logs[key];
      if (day && Object.values(day).some(x => x.done)) n++;
      else { if (key === todayStr()) { d.setDate(d.getDate() - 1); continue; } break; }
      d.setDate(d.getDate() - 1);
      if (n > 365) break;
    }
    return n;
  },
  todoStats() {
    const todos = DB.get('wb_todos', []).filter(x => !x.archived);
    return {
      total: todos.length,
      done: todos.filter(x => x.done).length,
      undone: todos.filter(x => !x.done).length,
      important: todos.filter(x => !x.done && x.priority === 1).length,
      overdue: todos.filter(x => !x.done && x.due && x.due < todayStr() && !x.auto).length
    };
  },
  // 最近 n 天打卡热区数据
  heatDays(n = 7) {
    const logs = Checkin.all();
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const c = Object.values(logs[key] || {}).filter(x => x.done).length;
      out.push({ date: key, count: c, level: c === 0 ? 0 : c === 1 ? 1 : c === 2 ? 2 : 3, label: WEEK_CN[d.getDay()] });
    }
    return out;
  }
};

/* ==================================================================
 * 12. 待办任务模块（增强版）
 * 支持：优先级/截止时间/标签/重复周期/归档/批量操作/历史记录/编辑
 * ================================================================== */
const PRIORITY = { 1: { name: '高', cls: 'p1' }, 2: { name: '中', cls: 'p2' }, 3: { name: '低', cls: 'p3' } };
const REPEAT_NAME = { none: '', daily: '🔁每日', weekly: '🔁每周' };

// 启动时：① 处理重复任务的跨天重置 ② 为训练模块创建今日自动待办
function ensureDailyTodos() {
  const todos = DB.get('wb_todos', []);
  const t = todayStr();
  let changed = false;
  todos.forEach(x => {
    if (x.done && x.doneAt) {
      const doneDay = new Date(x.doneAt).toLocaleDateString('sv');
      const resetDaily = x.repeat === 'daily' && doneDay !== t;
      const resetWeekly = x.repeat === 'weekly' && doneDay !== t && new Date(x.doneAt).getDay() === 1 && doneDay < t;
      if (resetDaily || resetWeekly) { x.done = false; x.doneAt = null; changed = true; }
    }
  });
  // 训练模块自动待办（模块被隐藏时不生成；用户当天手动删过的不重建）
  const delLog = DB.get('wb_auto_del', {});
  Object.entries(CHECK_MODULES).forEach(([mod, cfg]) => {
    if (Settings.isHidden(mod === 'cet' ? 'cet' : mod)) return;
    if (delLog[mod] === t) return;
    if (!todos.find(x => x.auto === mod && !x.archived)) {
      todos.unshift({ id: uid(), text: cfg.name, priority: 2, due: t, tags: ['打卡'], repeat: 'daily', auto: mod, done: false, doneAt: null, createdAt: Date.now(), archived: false });
      changed = true;
    }
  });
  if (changed) DB.set('wb_todos', todos);
}

  if (TodoFilter.tab === 'overdue') list = list.filter(x => !x.done && !x.archived && x.due && x.due < t && !x.auto);
  if (TodoFilter.tab === 'important') list = list.filter(x => !x.done && !x.archived && x.priority === 1);

  const item = x => {

        <div class="flex items-start gap-2">
          <span class="cursor-pointer select-none flex-1 ${x.done ? 'line-through muted' : ''}" data-toggle-done>${x.done ? '✅' : '⬜'} ${esc(x.text)}</span>
          ${x.auto ? '<span class="small muted" title="打卡自动生成">🤖</span>' : ''}
        </div>
        <div class="flex flex-wrap gap-1.5 mt-1.5 items-center">
          ${x.due ? `<span class="small ${overdue ? 'px-1.5 rounded' : 'muted'}" style="${overdue ? 'background:rgba(239,68,68,.15);color:var(--err)' : ''}">📅 ${fmtFull(x.due)}${overdue ? ' 已逾期' : ''}</span>` : ''}
          ${REPEAT_NAME[x.repeat] ? `<span class="small muted">${REPEAT_NAME[x.repeat]}</span>` : ''}
          ${(x.tags || []).map(tg => `<span class="tag">#${esc(tg)}</span>`).join('')}
          ${x.note ? `<span class="small muted" title="${esc(x.note)}">📝 ${esc(x.note.slice(0, 14))}${x.note.length > 14 ? '…' : ''}</span>` : ''}
        </div>
      </div>
      <div class="flex flex-col gap-1">
        ${TodoFilter.tab === 'archived'
          ? `<button class="btn btn-sm" data-restore title="恢复">↩️</button>`
          : `<button class="btn btn-sm" data-edit title="编辑">✎</button>
             <button class="btn btn-sm" data-archive title="${x.archived ? '取消归档' : '归档'}">📦</button>`}
        <button class="btn btn-sm btn-danger" data-del title="删除">🗑</button>
      </div>
    </div>`;
  };

  return `
  <div class="card mb-3">
    <div class="card-title">➕ 快速添加任务</div>
    <div class="grid gap-2" style="grid-template-columns:1fr;max-width:720px">
      <input class="input" id="td-text" placeholder="要做什么？（回车快速添加）" maxlength="60">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
        <select class="input" id="td-pri"><option value="2">🟡 中优先级</option><option value="1">🔴 高优先级</option><option value="3">🔵 低优先级</option></select>
        <input class="input" id="td-due" type="date">
        <input class="input" id="td-tags" placeholder="标签，逗号分隔">
        <select class="input" id="td-repeat"><option value="none">不重复</option><option value="daily">🔁 每日循环</option><option value="weekly">🔁 每周循环</option></select>
      </div>
      <button class="btn btn-pri" id="td-add">添加任务</button>
    </div>
  </div>

  <div class="flex gap-2 items-center mb-3 overflow-x-auto pb-1">
    ${tabs.map(([k, n]) => `<span class="chip ${TodoFilter.tab === k ? 'on' : ''}" data-tab="${k}">${n}</span>`).join('')}
    <span class="flex-1"></span>
    <input class="input" style="width:150px" id="td-search" placeholder="🔍 搜索任务" value="${esc(TodoFilter.search)}">
    <button class="btn btn-sm ${TodoFilter.batch ? 'btn-pri' : ''}" data-batchmode>${TodoFilter.batch ? '退出批量' : '批量操作'}</button>

AfterRender.todos = box => {
  const t = todayStr();
  const saveAndRender = () => { Ach.check(); Nav.refresh(); };

  // 添加任务
  const add = () => {
    const text = $('#td-text').value.trim();
    if (!text) { Toast.show('先写点任务内容吧', 'warn'); return; }
    const todos = DB.get('wb_todos', []);
    todos.unshift({
      id: uid(), text, priority: +$('#td-pri').value, due: $('#td-due').value,
      tags: $('#td-tags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean).slice(0, 4),
      repeat: $('#td-repeat').value, done: false, doneAt: null, createdAt: Date.now(), archived: false
    });
    DB.set('wb_todos', todos);
    $('#td-text').value = ''; $('#td-tags').value = '';
    Toast.show('任务已添加');
    saveAndRender();
  };
  box.querySelector('#td-add').onclick = add;
  box.querySelector('#td-text').addEventListener('keydown', e => { if (e.key === 'Enter') add(); });

  // 筛选
  box.querySelectorAll('[data-tab]').forEach(el => el.onclick = () => { TodoFilter.tab = el.dataset.tab; Nav.refresh(); });
  const search = box.querySelector('#td-search');
  search.oninput = debounce(() => { TodoFilter.search = search.value; Nav.refresh(); const s2 = $('#td-search'); if (s2) { s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); } }, 400);
  box.querySelector('[data-history]').onclick = openTodoHistory;
  box.querySelector('[data-batchmode]').onclick = () => { TodoFilter.batch = !TodoFilter.batch; TodoFilter.selected.clear(); Nav.refresh(); };

  // 批量操作
  const selAll = box.querySelector('[data-selall]');
  if (selAll) selAll.onclick = () => {
    $$('#todo-list [data-todo]').forEach(el => TodoFilter.selected.add(el.dataset.todo));
    Nav.refresh();
  };
  const bulk = async (fn, msg) => {
    if (!TodoFilter.selected.size) { Toast.show('先勾选任务', 'warn'); return; }
    if (fn === 'del') { const ok = await Dialog.confirm({ title: '批量删除', danger: true, text: `确定删除选中的 ${TodoFilter.selected.size} 项任务吗？`, okText: '删除' }); if (!ok) return; }
    const todos = DB.get('wb_todos', []);
    todos.forEach(x => { if (TodoFilter.selected.has(x.id)) { if (fn === 'done') { x.done = true; x.doneAt = Date.now(); } if (fn === 'arch') x.archived = true; } });
    const kept = fn === 'del' ? todos.filter(x => !TodoFilter.selected.has(x.id)) : todos;
    DB.set('wb_todos', kept);
    TodoFilter.selected.clear();
    Toast.show(msg); saveAndRender();
  };
  box.querySelector('[data-bulkdone]')?.addEventListener('click', () => bulk('done', '批量完成成功'));
  box.querySelector('[data-bulkarchive]')?.addEventListener('click', () => bulk('arch', '批量归档成功'));
  box.querySelector('[data-bulkdel]')?.addEventListener('click', () => bulk('del', '批量删除成功'));

  // 列表项事件（委托）
  const listEl = box.querySelector('#todo-list');
  listEl.addEventListener('click', async e => {
    const row = e.target.closest('[data-todo]');
    if (!row) return;
    const id = row.dataset.todo;
    const todos = DB.get('wb_todos', []);
    const x = todos.find(v => v.id === id);
    if (!x) return;
    if (e.target.closest('[data-toggle-done]') || e.target.closest('[data-batch]')) {
      if (e.target.closest('[data-batch]')) { e.target.checked ? TodoFilter.selected.add(id) : TodoFilter.selected.delete(id); box.querySelector('[data-selall]') && (box.querySelectorAll('[data-batch]').length, 0); return; }
      x.done = !x.done; x.doneAt = x.done ? Date.now() : null;
      DB.set('wb_todos', todos);
      Toast.show(x.done ? '完成任务，干得漂亮！' : '已标记为未完成');
      saveAndRender(); return;
    }
    if (e.target.closest('[data-edit]')) return editTodo(x);
    if (e.target.closest('[data-archive]')) {
      x.archived = !x.archived; DB.set('wb_todos', todos);

          <option value="weekly" ${x.repeat === 'weekly' ? 'selected' : ''}>每周循环</option></select>`,

        };
      }
    });
  }

  // 历史记录（已完成 + 归档，按日期分组回看）
  function openTodoHistory() {
    const all = DB.get('wb_todos', []).filter(x => x.done || x.archived).sort((a, b) => (b.doneAt || b.createdAt) - (a.doneAt || a.createdAt));
    const groups = {};

AfterRender.smart = box => {
  const save = goals => DB.set('wb_smart', goals);
  box.querySelector('#sm-add').onclick = () => {
    const title = $('#sm-title').value.trim();
    if (!title) { Toast.show('先填写目标标题', 'warn'); return; }
    const goals = DB.get('wb_smart', []);
    goals.unshift({
      id: uid(), title,
      s: $('#sm-s').value.trim(), m: $('#sm-m').value.trim(), a: $('#sm-a').value.trim(),
      r: $('#sm-r').value.trim(), deadline: $('#sm-deadline').value,
      subtasks: [], createdAt: Date.now()
    });
    save(goals); Ach.check();
    Toast.show('SMART 目标已创建');
    ['sm-title', 'sm-s', 'sm-m', 'sm-a', 'sm-r'].forEach(id => $('#' + id).value = '');
    Nav.refresh();
  };

  box.addEventListener('click', async e => {
    const card = e.target.closest('[data-goal]');
    if (!card) return;
    const goals = DB.get('wb_smart', []);
    const g = goals.find(x => x.id === card.dataset.goal);
    if (!g) return;

    if (e.target.closest('[data-del-goal]')) {
      if (!await Dialog.confirm({ title: '删除目标', danger: true, text: `删除「${esc(g.title)}」及其全部子任务？`, okText: '删除' })) return;
      save(goals.filter(x => x.id !== g.id)); Ach.check(); Toast.show('已删除'); Nav.refresh(); return;
    }
    if (e.target.closest('[data-ai-split]')) return AI.splitGoal(g);

    // 勾选目标已完成 / 取消完成
    if (e.target.closest('[data-goal-done]')) {
      if (g.completedAt) {
        if (!await Dialog.confirm({ title: '取消完成状态', text: `把「${esc(g.title)}」恢复为进行中？`, okText: '恢复进行中' })) return;
        g.completedAt = null;
        Toast.show('已恢复为进行中', 'info');
      } else {
        g.completedAt = Date.now();
        Toast.show('🎉 目标已完成，成就殿堂已同步');
      }
      save(goals); Ach.check(); Nav.refresh(); return;
    }

    const subEl = e.target.closest('[data-sub]');
    if (subEl) {
      const s = g.subtasks.find(x => x.id === subEl.dataset.sub);
      if (!s) return;
      if (e.target.closest('[data-sub-toggle]')) {
        s.done = !s.done;
        // 同步关联待办状态
        if (s.todoId) {
          const todos = DB.get('wb_todos', []);
          const td = todos.find(v => v.id === s.todoId);
          if (td) { td.done = s.done; td.doneAt = s.done ? Date.now() : null; DB.set('wb_todos', todos); }
        }
        save(goals); Ach.check(); Nav.refresh(); return;
      }
      if (e.target.closest('[data-sub-todo]')) {
        // 子任务 → 生成待办，建立双向关联
        const todos = DB.get('wb_todos', []);
        const todo = { id: uid(), text: `[${g.title}] ${s.text}`, priority: 2, due: g.deadline || '', tags: ['目标'], repeat: 'none', done: false, doneAt: null, createdAt: Date.now(), archived: false };
        todos.unshift(todo);
        DB.set('wb_todos', todos);
        s.todoId = todo.id;
        save(goals);
        Toast.show('已生成待办任务，完成后自动勾选子任务'); Nav.refresh(); return;
      }
      if (e.target.closest('[data-sub-del]')) {
        g.subtasks = g.subtasks.filter(x => x.id !== s.id);
        save(goals); Nav.refresh(); return;
      }
    }
  });

  // 子任务快捷添加（回车）
  box.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !e.target.matches('[data-newsub]')) return;
    const card = e.target.closest('[data-goal]');
    const goals = DB.get('wb_smart', []);
    const g = goals.find(x => x.id === card.dataset.goal);
    const text = e.target.value.trim();
    if (!g || !text) return;
    g.subtasks.push({ id: uid(), text, done: false });
    save(goals); Nav.refresh();
  });
};

 * ================================================================== */
const Ach = {
  DEFS: [
    { id: 'todo_1',    icon: '🌱', name: '第一步',       desc: '完成 1 个待办任务' },
    { id: 'todo_50',   icon: '💪', name: '任务达人',     desc: '累计完成 50 个任务' },
    { id: 'streak_3',  icon: '🔥', name: '三连击',       desc: '连续打卡 3 天' },
    { id: 'streak_7',  icon: '⚡', name: '七日之约',     desc: '连续打卡 7 天' },
    { id: 'streak_30', icon: '👑', name: '三十而立',     desc: '连续打卡 30 天' },
    { id: 'allin',     icon: '🌟', name: '全勤王',       desc: '同一天完成全部 4 项训练打卡' },
    { id: 'dance_1',   icon: '💃', name: '舞动初体验',   desc: '首次舞蹈打卡' },
    { id: 'dance_10',  icon: '🩰', name: '舞林高手',     desc: '舞蹈打卡 10 次' },
    { id: 'vocal_1',   icon: '🎤', name: '开嗓',         desc: '首次练声打卡' },
    { id: 'vocal_10',  icon: '🎼', name: '金嗓子',       desc: '练声打卡 10 次' },
    { id: 'word_10',   icon: '📘', name: '词汇起步',     desc: '学会 10 个四级单词' },
    { id: 'word_100',  icon: '📚', name: '词汇大师',     desc: '学会 100 个四级单词' },
    { id: 'score_1',   icon: '📝', name: '实战开始',     desc: '记录第一次真题成绩' },
    { id: 'book_1',    icon: '📖', name: '读完第一本',   desc: '完整读完 1 本书' },
    { id: 'book_5',    icon: '🗂', name: '书虫养成',     desc: '读完 5 本书' },
    { id: 'note_10',   icon: '💡', name: '灵感捕手',     desc: '累计 10 条灵感笔记' },
    { id: 'diary_1',   icon: '📔', name: '自我觉察',     desc: '写下第一篇元认知日记' },
    { id: 'diary_10',  icon: '🧘', name: '反思达人',     desc: '累计 10 篇元认知日记' },
    { id: 'fin_1',     icon: '🪙', name: '第一笔账',     desc: '记下第一笔账单' },
    { id: 'fin_30',    icon: '💰', name: '记账小能手',   desc: '累计 30 笔账单' },
    { id: 'bdj_7',     icon: '🌿', name: '养生入门',     desc: '八段锦打卡 7 次' },
    { id: 'smart_1',   icon: '🎯', name: '目标制定者',   desc: '创建 1 个 SMART 目标' },
    { id: 'smart_done',icon: '🏁', name: '目标达成',     desc: '完成 1 个 SMART 目标' }
  ],
  // 汇总各模块真实数据
  stats() {
    const checkins = Checkin.all();
    const counts = { dance: 0, vocal: 0, cet: 0, wellness: 0 };
    let fullDays = 0;
    Object.values(checkins).forEach(day => {
      let c = 0;
      Object.entries(day).forEach(([k, v]) => { if (v.done && counts[k] !== undefined) { counts[k]++; c++; } });
      if (c >= 4) fullDays++;
    });
    const vocab = DB.get('wb_cet_vocab', []);
    const smart = DB.get('wb_smart', []);
    return {
      todosDone: DB.get('wb_todos', []).filter(x => x.done).length,
      streak: Stats.streak(),
      fullDays,
      dance: counts.dance, vocal: counts.vocal,
      wellness: counts.wellness,
      bdj: DB.get('wb_wellness', { bdj: [] }).bdj?.length || 0,
      words: vocab.filter(w => w.stage >= 1).length,
      scores: DB.get('wb_cet_scores', []).length,
      booksDone: DB.get('wb_books', []).filter(b => b.status === 'done').length,
      notes: DB.get('wb_notes', []).filter(n => n.type === 'idea').length,
      diaries: DB.get('wb_notes', []).filter(n => n.type === 'meta').length,
      finRecords: DB.get('wb_finance', { records: [] }).records?.length || 0,
      smartGoals: smart.length,
      // 目标达成：全部子任务完成 或 用户手动勾选了“已完成”
      smartDone: smart.filter(g => g.completedAt || (g.subtasks.length && g.subtasks.every(s => s.done))).length
    };
  },
  // 每次数据变化后调用：检查解锁。返回是否有新解锁
  check() {
    this._syncSmart();
    const s = this.stats();
    const cond = {
      todo_1: s.todosDone >= 1, todo_50: s.todosDone >= 50,
      streak_3: s.streak >= 3, streak_7: s.streak >= 7, streak_30: s.streak >= 30,
      allin: s.fullDays >= 1, dance_1: s.dance >= 1, dance_10: s.dance >= 10,
      vocal_1: s.vocal >= 1, vocal_10: s.vocal >= 10,
      word_10: s.words >= 10, word_100: s.words >= 100, score_1: s.scores >= 1,
      book_1: s.booksDone >= 1, book_5: s.booksDone >= 5,
      note_10: s.notes >= 10, diary_1: s.diaries >= 1, diary_10: s.diaries >= 10,
      fin_1: s.finRecords >= 1, fin_30: s.finRecords >= 30,
      bdj_7: s.bdj >= 7, smart_1: s.smartGoals >= 1, smart_done: s.smartDone >= 1
    };
    const unlocked = DB.get('wb_ach', {});
    let newly = 0;
    this.DEFS.forEach(d => {
      if (cond[d.id] && !unlocked[d.id]) {
        unlocked[d.id] = Date.now();
        newly++;
        Toast.show(`🏆 成就解锁：${d.name}`, 'info');
      }
    });
    if (newly) DB.set('wb_ach', unlocked);
    return newly;
  },
  // SMART 子任务 ↔ 待办 双向同步（待办完成 → 子任务勾选）
  _syncSmart() {
    const goals = DB.get('wb_smart', []);
    const todos = DB.get('wb_todos', []);
    let changed = false;
    goals.forEach(g => g.subtasks.forEach(s => {
      if (s.todoId) {
        const td = todos.find(v => v.id === s.todoId);
        if (td && td.done !== s.done) { s.done = td.done; changed = true; }
      }
    }));
    if (changed) DB.set('wb_smart', goals);
  },

  /* ---- 自定义成就（用户自建定义，手动标记达成/取消） ---- */
  customs() { return DB.get('wb_ach_custom', []); },
  all() { return [...this.DEFS, ...this.customs()]; },
  // 新增/编辑自定义成就
  saveCustom(data, editId) {
    const list = this.customs();
    if (editId) {
      const c = list.find(x => x.id === editId);
      if (c) { c.icon = data.icon; c.name = data.name; c.desc = data.desc; }
    } else {
      list.unshift({ id: 'custom_' + uid(), custom: true, createdAt: Date.now(), ...data });
    }
    DB.set('wb_ach_custom', list);
  },
  delCustom(id) {
    DB.set('wb_ach_custom', this.customs().filter(x => x.id !== id));
    // 同时清掉解锁记录
    const unlocked = DB.get('wb_ach', {});
    delete unlocked[id]; DB.set('wb_ach', unlocked);
  },
  // 手动标记达成 / 取消达成（自定义成就专用）
  toggleUnlocked(id) {
    const unlocked = DB.get('wb_ach', {});
    if (unlocked[id]) { delete unlocked[id]; DB.set('wb_ach', unlocked); return false; }
    unlocked[id] = Date.now(); DB.set('wb_ach', unlocked);
    return true;
  }
};

/* ==================================================================
 * 16. Canvas 图表工具（无外部依赖）
 * ================================================================== */
// 折线图：drawLine(canvas, ['8-1','8-2'], [520, 545])
function drawLine(cv, labels, values, color = '#f97316') {
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 300, H = cv.clientHeight || 160;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cText = cs.getPropertyValue('--sub').trim() || '#888';
  const cBorder = cs.getPropertyValue('--border').trim() || '#ddd';
  ctx.clearRect(0, 0, W, H);
  if (!values.length) return;
  const max = Math.max(...values, 1), min = Math.min(...values, 0);
  const pad = { l: 34, r: 10, t: 12, b: 22 };
  const px = i => pad.l + (W - pad.l - pad.r) * (values.length === 1 ? 0.5 : i / (values.length - 1));
  const py = v => H - pad.b - (H - pad.t - pad.b) * ((v - min) / (max - min || 1));
  // 网格与刻度
  ctx.strokeStyle = cBorder; ctx.fillStyle = cText; ctx.font = '10px sans-serif'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const v = min + (max - min) * i / 4;
    const y = py(v);
    ctx.globalAlpha = .5; ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillText(Math.round(v), 4, y + 3);
  }
  // 折线
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
  values.forEach((v, i) => i ? ctx.lineTo(px(i), py(v)) : ctx.moveTo(px(i), py(v)));
  ctx.stroke();
  // 点 + 横轴
  ctx.fillStyle = color;
  values.forEach((v, i) => { ctx.beginPath(); ctx.arc(px(i), py(v), 3, 0, 7); ctx.fill(); });
  labels.forEach((l, i) => {
    if (labels.length > 8 && i % Math.ceil(labels.length / 8) !== 0) return;
    ctx.fillStyle = cText; ctx.fillText(l, px(i) - 10, H - 6);
  });
}

/* ==================================================================
 * 18. 节拍器：Web Audio API 真实发声（前瞻调度，节奏精准）
 * 1-8 拍循环，第 1、5 拍重音（高音色+红点高亮）
 * ================================================================== */
const Metro = {
  playing: false, bpm: 100, beat: 0, nextTime: 0, timer: null, ctx: null,
  ensureCtx() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  start() {
    const ctx = this.ensureCtx();
    this.nextTime = ctx.currentTime + 0.08;
    this.beat = 0;
    this.playing = true;
    this.timer = setInterval(() => this.schedule(), 25);
    this.render();
  },
  stop() {
    this.playing = false;
    clearInterval(this.timer);
    this.render();
  },
  toggle() { this.playing ? this.stop() : this.start(); },
  setBpm(v) { this.bpm = Math.min(208, Math.max(40, v)); const el = $('#mt-bpm'); if (el) el.textContent = this.bpm; },
  // 前瞻调度：每 25ms 检查，把未来 0.12s 内的节拍精确排入音频时间轴
  schedule() {
    const ctx = this.ctx, spb = 60 / this.bpm;
    while (this.nextTime < ctx.currentTime + 0.12) {
      this.playBeat(this.beat, this.nextTime);
      const delay = Math.max(0, (this.nextTime - ctx.currentTime) * 1000);
      setTimeout(() => this.flash(this.beat), delay);
      this.beat = (this.beat + 1) % 8;
      this.nextTime += spb;
    }
  },
  playBeat(beat, time) {
    const ctx = this.ctx;
    const o = ctx.createOscillator(), g = ctx.createGain();
    const accent = beat === 0 || beat === 4; // 第 1、5 拍重音
    o.type = accent ? 'square' : 'sine';
    o.frequency.value = accent ? 1318 : 880;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(accent ? 0.5 : 0.3, time + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.1);
    o.connect(g).connect(ctx.destination);
    o.start(time); o.stop(time + 0.12);
  },
  // 节拍点亮动画（与声音同步）
  flash(beat) {
    if (!this.playing) return;
    const dot = $(`.metro-dot[data-beat="${beat}"]`);
    if (!dot) return;
    dot.classList.add('hit');
    setTimeout(() => dot.classList.remove('hit'), 110);
  },
  render() {
    const btn = $('#mt-toggle');
    if (btn) {
      btn.textContent = this.playing ? '⏹ 停止' : '▶ 开始打拍';
      btn.classList.toggle('btn-pri', !this.playing);
    }
  }
};

AfterRender.cet = box => {
  // 记录学习行为 → 触发四级打卡联动
  const learned = () => Checkin.record('cet', { minutes: 0 });
  // 打开「不背单词」外部 App
  box.querySelector('#vc-bbdc').onclick = () => DeepLink.open(Apps.bbdc);

  box.querySelector('#vc-wadd').onclick = () => {
    const word = $('#vc-word').value.trim(), meaning = $('#vc-mean').value.trim();
    if (!word || !meaning) { Toast.show('单词和释义都要填', 'warn'); return; }
    const all = Vocab.all();
    if (all.some(w => w.word.toLowerCase() === word.toLowerCase())) { Toast.show('这个词已经在词库里啦', 'warn'); return; }
    all.unshift({ id: uid(), word, meaning, stage: 0, nextReview: '', wrong: 0, addedAt: Date.now() });
    Vocab.save(all);
    $('#vc-word').value = ''; $('#vc-mean').value = '';
    Toast.show('已添加，点击「开始学习」进入复习计划'); Nav.refresh();
  };
  box.querySelector('#vc-import').onclick = () => {
    Modal.open({
      title: '📋 批量导入单词',
      body: `<textarea class="input" rows="8" id="vc-import-ta" placeholder="每行一个，格式：单词,释义&#10;abandon,v. 放弃&#10;ability,n. 能力"></textarea>`,
      foot: '<button class="btn btn-pri" data-ok>导入</button>',
      onMount(m) {
        m.querySelector('[data-ok]').onclick = () => {
          const lines = m.querySelector('#vc-import-ta').value.split('\n').map(s => s.trim()).filter(Boolean);
          const all = Vocab.all();
          let n = 0;
          lines.forEach(l => {
            const [w, ...rest] = l.split(/[,，]/);
            const meaning = rest.join(',').trim();
            if (!w || !meaning) return;
            if (all.some(v => v.word.toLowerCase() === w.trim().toLowerCase())) return;
            all.push({ id: uid(), word: w.trim(), meaning, stage: 0, nextReview: '', wrong: 0, addedAt: Date.now() });
            n++;
          });
          Vocab.save(all);
          Modal.close(); Toast.show(`成功导入 ${n} 个单词`); Nav.refresh();
        };
      }
    });
  };
  box.querySelector('#vc-search').oninput = debounce(e => { VocabUI.search = e.target.value; Nav.refresh(); const s = $('#vc-search'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 400);

  box.addEventListener('click', async e => {
    const row = e.target.closest('[data-word]');
    if (!row) return;
    const all = Vocab.all();
    const w = all.find(x => x.id === row.dataset.word);
    if (!w) return;
    const t = todayStr();

    if (e.target.closest('[data-reveal]')) { VocabUI.revealed.has(w.id) ? VocabUI.revealed.delete(w.id) : VocabUI.revealed.add(w.id); Nav.refresh(); return; }
    if (e.target.closest('[data-w-del]')) {
      if (!await Dialog.confirm({ title: '删除单词', danger: true, text: `从词库删除「${esc(w.word)}」？`, okText: '删除' })) return;
      Vocab.save(all.filter(x => x.id !== w.id)); Toast.show('已删除'); Nav.refresh(); return;
    }
    if (e.target.closest('[data-w-learn]')) {
      w.stage = 1; w.nextReview = addDays(t, EBB_INTERVALS[0]); w.learnedAt = t;
      Vocab.save(all); learned(); Toast.show(`开始学「${w.word}」，明天安排第 1 次复习`); Nav.refresh(); return;
    }
    if (e.target.closest('[data-w-ok]')) {
      w.stage = Math.min(6, w.stage + 1);
      w.nextReview = w.stage >= 6 ? '' : addDays(t, EBB_INTERVALS[w.stage - 1]);
      Vocab.save(all); learned();
      Toast.show(w.stage >= 6 ? `「${w.word}」已掌握！🎉` : `很好！下次复习：${w.nextReview}`);
      Nav.refresh(); return;
    }
    if (e.target.closest('[data-w-fuzzy]')) {
      w.nextReview = addDays(t, 1);
      Vocab.save(all); learned(); Toast.show('明天再见到它'); Nav.refresh(); return;
    }
    if (e.target.closest('[data-w-no]')) {
      w.stage = 1; w.nextReview = addDays(t, 1); w.wrong = (w.wrong || 0) + 1;
      Vocab.save(all); learned(); Toast.show('没关系，多见几遍就熟了 💪'); Nav.refresh();
    }
  });
};
// 日期加 N 天
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toLocaleDateString('sv');
}

// 我的抖音学习库：收藏抖音视频链接，一键在 App 内直开该视频
const DyPicks = {
  list() { return DB.get('wb_dy_picks', []); },
  save(l) { DB.set('wb_dy_picks', l); },
  // 从粘贴文本解析视频 ID 与标题
  parse(text) {
    const s = String(text || '');
    const idM = s.match(/(?:video|note)\/(\d{6,})/);
    const tM = s.match(/[【\[]([^】\]]{2,40})[】\]]/);
    return { awemeId: idM ? idM[1] : '', title: tM ? tM[1] : '' };
  },
  add(text) {
    const p = this.parse(text);
    if (!p.awemeId) return false;
    const l = this.list();
    if (l.some(x => x.awemeId === p.awemeId)) return 'dup';
    l.unshift({ awemeId: p.awemeId, title: p.title, at: Date.now() });
    this.save(l);
    return true;
  },
  remove(awemeId) { this.save(this.list().filter(x => x.awemeId !== awemeId)); },
  // 直达：手机唤起抖音 App 内该视频；电脑打开网页版视频
  open(awemeId) {
    DeepLink.open({ ...Apps.douyin,
      url: `https://www.douyin.com/video/${awemeId}`,
      path: `//aweme/detail/${awemeId}` });
  }
};

AfterRender.listening = box => {
  box.querySelector('#ls-save').onclick = () => {
    const minutes = num($('#ls-min').value);
    if (!minutes) { Toast.show('请填写有效时长', 'warn'); return; }
    const logs = Listen.data().logs;
    const t = todayStr();
    const exist = logs.find(l => l.date === t);
    if (exist) exist.minutes = minutes; else logs.push({ date: t, minutes });
    DB.set('wb_cet_listen', { logs });
    Checkin.record('cet', { minutes });
    Toast.show(`已记录 ${minutes} 分钟听力打卡！`); Nav.refresh();
  };
  // 抖音学习库：收藏
  const linkInput = box.querySelector('#ln-dy-link');
  const addPick = async () => {
    const val = linkInput.value.trim();
    if (!val) { Toast.show('先粘贴抖音视频链接', 'warn'); return; }
    let r = DyPicks.add(val);
    // 短链：尝试跟随跳转解析（部分浏览器允许时可用）
    if (!r) {
      const sm = val.match(/https?:\/\/v\.douyin\.com\/[^\s，]+/);
      if (sm) {
        try { const fr = await fetch(sm[0], { redirect: 'follow' }); r = DyPicks.add(fr.url); } catch (e) {}
      }
    }
    if (r === 'dup') Toast.show('这个视频已经收藏过啦', 'warn');
    else if (r) { Toast.show('✅ 已收藏，点"打开"直达视频'); Nav.refresh(); }
    else Toast.show('没识别出视频，建议在抖音"分享 → 复制链接"后完整粘贴', 'warn');
  };
  box.querySelector('#ln-dy-add').onclick = addPick;
  linkInput.addEventListener('keydown', e => { if (e.key === 'Enter') addPick(); });
  // 打开 / 删除（事件委托）
  box.addEventListener('click', e => {
    const o = e.target.closest('[data-dy-open]');
    if (o) { DyPicks.open(o.dataset.dyOpen); return; }
    const d = e.target.closest('[data-dy-del]');
    if (d) { DyPicks.remove(d.dataset.dyDel); Toast.show('已取消收藏'); Nav.refresh(); }
  });
};
